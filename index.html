<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notes</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --success: #22c55e;
    --warn: #f59e0b;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, .25);
    --ripple-light: rgba(255, 255, 255, .5);
    --ripple-surface: rgba(37, 99, 235, .22);
  }

  [data-theme="dark"] {
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-soft: #1e293b;
    --border: #1e293b;
    --border-strong: #334155;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --bg: #0b1220;
    --surface: #0f172a;
    --surface-2: #1e293b;
    --danger: #f87171;
    --danger-soft: #2a1414;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, .6);
    --ripple-light: rgba(255, 255, 255, .3);
    --ripple-surface: rgba(96, 165, 250, .25);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s ease, color .2s ease;
  }

  button, input, textarea, select { font-family: inherit; }
  .hidden { display: none !important; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* App shell */
  .app {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
    transition: grid-template-columns .2s ease;
  }

  .app.is-focus { grid-template-columns: 0 minmax(0, 1fr); }
  .app.is-focus .sidebar { display: none; }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    transition: background-color .2s ease, border-color .2s ease;
  }

  .sidebar__head {
    padding: 14px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .sidebar__title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 18px;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--text-muted);
    background: var(--surface-2);
    border-radius: 999px;
  }

  .badge--danger { color: var(--danger); background: var(--danger-soft); }

  .sidebar__actions { display: flex; align-items: center; gap: 4px; }

  /* Search */
  .search { position: relative; display: flex; align-items: center; }

  .search > svg {
    position: absolute;
    left: 11px;
    width: 15px; height: 15px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .search input {
    width: 100%;
    padding: 9px 32px 9px 34px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }

  /* Hide native search clear button */
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }

  .search input::placeholder { color: var(--text-faint); }

  .search input:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
  }

  .search__clear {
    position: absolute;
    right: 6px;
    display: grid;
    place-items: center;
    width: 22px; height: 22px;
    color: var(--text-faint);
    background: none;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
  }

  .search__clear:hover { color: var(--text); background: var(--surface-2); }
  .search__clear svg { width: 12px; height: 12px; }

  /* Sort row */
  .sidebar__controls { display: flex; align-items: center; gap: 8px; }

  .select { position: relative; flex: 1; display: flex; align-items: center; }

  .select svg {
    position: absolute;
    right: 9px;
    width: 12px; height: 12px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .select select {
    width: 100%;
    padding: 7px 26px 7px 10px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    transition: border-color .15s ease;
  }

  .select select:hover { border-color: var(--border-strong); }
  .select select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }

  /* Note list */
  .note-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin: 0;
    padding: 4px 10px 16px;
    list-style: none;
    overscroll-behavior: contain;
  }

  .note-item {
    display: block;
    width: 100%;
    padding: 11px 12px 11px 16px;
    text-align: left;
    color: var(--text);
    background: none;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    transition: background-color .13s ease;
    position: relative;
  }

  .note-item::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 2px;
    background: transparent;
    transition: background-color .13s ease;
  }

  .note-item.has-color::before { background: var(--note-color); }

  .note-item:hover { background: var(--surface-2); }
  .note-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .note-item.is-active {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .28);
  }

  .note-item__top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }

  .note-item__title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-item__pin {
    flex: none;
    width: 13px; height: 13px;
    color: var(--accent);
    opacity: 0;
    transition: opacity .12s ease;
  }

  .note-item.is-pinned .note-item__pin { opacity: 1; }

  .note-item__preview {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-item__time {
    margin-top: 5px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--text-faint);
  }

  mark {
    padding: 0 1px;
    color: inherit;
    background: rgba(250, 204, 21, .45);
    border-radius: 2px;
  }

  [data-theme="dark"] mark { background: rgba(250, 204, 21, .28); }

  .list-empty {
    padding: 28px 16px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  /* Trash banner */
  .trash-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 10px 6px;
    padding: 9px 12px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface-2);
    border-radius: 8px;
  }

  .trash-banner button {
    font-size: 12px;
    font-weight: 600;
    color: var(--danger);
    background: none;
    border: 0;
    cursor: pointer;
    padding: 3px 7px;
    border-radius: 5px;
    position: relative;
    overflow: hidden;
  }

  .trash-banner button:hover { background: var(--danger-soft); }

  /* Split button */
  .split-button {
    position: relative;
    display: inline-flex;
    vertical-align: middle;
  }

  .split-button--block { display: flex; width: 100%; }

  .split-button button {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }

  .split-button__main {
    flex: 1;
    padding: 9px 16px;
    text-align: center;
    border-radius: 8px 0 0 8px;
    border-right: none;
  }

  .split-button__toggle {
    display: grid;
    place-items: center;
    padding: 9px 11px;
    border-radius: 0 8px 8px 0;
    border-left: 1px solid rgba(255, 255, 255, .4);
  }

  .split-button__toggle svg { transition: transform .15s ease; }
  .split-button button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .split-button button:active { transform: translateY(1px); }
  .split-button button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  .split-button.is-open .split-button__toggle { background: var(--accent-hover); border-color: var(--accent-hover); }
  .split-button.is-open .split-button__toggle svg { transform: rotate(180deg); }

  /* Dropdown menu */
  .menu-wrap { position: relative; display: inline-flex; }

  .menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 40;
    min-width: 220px;
    margin: 0;
    padding: 5px;
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s;
  }

  .is-open > .menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .menu [role="menuitem"] {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 11px;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    color: var(--text);
    background: none;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .menu [role="menuitem"]:hover,
  .menu [role="menuitem"]:focus-visible {
    background: var(--accent-soft);
    color: var(--accent);
    outline: none;
  }

  .menu [role="menuitem"] svg {
    flex: none;
    width: 15px; height: 15px;
    color: var(--text-muted);
  }

  .menu [role="menuitem"]:hover svg,
  .menu [role="menuitem"]:focus-visible svg { color: var(--accent); }

  .menu [role="menuitem"].is-danger { color: var(--danger); }
  .menu [role="menuitem"].is-danger svg { color: var(--danger); }
  .menu [role="menuitem"].is-danger:hover,
  .menu [role="menuitem"].is-danger:focus-visible { background: var(--danger-soft); }

  .menu__sep { height: 1px; margin: 5px 6px; background: var(--border); }

  .menu__shortcut {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
  }

  /* Ripple hosts */
  .icon-btn, .btn, .split-button button,
  .menu [role="menuitem"], .note-item, .toast__action,
  .search__clear, .context-menu__item, .toolbar__btn,
  .quick-switcher__item, .trash-banner button,
  .context-menu__swatch, .focus-exit {
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    user-select: none;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: var(--ripple-light);
    transform: scale(0);
    opacity: .9;
    animation: ripple-expand .6s cubic-bezier(.2, .6, .3, 1) forwards;
  }

  .ripple--dark { background: var(--ripple-surface); }

  @keyframes ripple-expand {
    to { transform: scale(1); opacity: 0; }
  }

  /* Editor */
  .editor {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--surface);
    transition: background-color .2s ease;
    position: relative;
  }

  .editor__pane {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .editor__bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
  }

  .editor__title {
    flex: 1;
    min-width: 0;
    padding: 2px 0;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text);
    background: none;
    border: 0;
    outline: none;
  }

  .editor__title::placeholder { color: var(--text-faint); }

  .editor__actions { display: flex; align-items: center; gap: 2px; }

  /* Markdown toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .toolbar::-webkit-scrollbar { display: none; }

  .toolbar__btn {
    display: grid;
    place-items: center;
    flex: none;
    width: 30px; height: 30px;
    color: var(--text-muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color .13s ease, color .13s ease, border-color .13s ease;
  }

  .toolbar__btn svg { width: 15px; height: 15px; }

  .toolbar__btn:hover {
    color: var(--accent);
    background: var(--surface);
    border-color: var(--border);
  }

  .toolbar__btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .toolbar__sep {
    flex: none;
    width: 1px;
    height: 20px;
    margin: 0 4px;
    background: var(--border);
  }

  .editor__scroll { flex: 1; min-height: 0; display: flex; }

  .editor__body, .editor__preview {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
  }

  .editor__body {
    resize: none;
    background: none;
    border: 0;
    outline: none;
    font-family: inherit;
  }

  .editor__body::placeholder { color: var(--text-faint); }

  .editor__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 20px 12px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  .editor__status { display: inline-flex; align-items: center; gap: 6px; }

  .editor__stats {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    transition: background-color .2s ease;
  }

  .dot.is-saving { background: var(--warn); }

  /* Markdown preview */
  .editor__preview { padding-top: 22px; }
  .editor__preview > *:first-child { margin-top: 0; }
  .editor__preview > *:last-child { margin-bottom: 0; }

  .editor__preview h1, .editor__preview h2, .editor__preview h3,
  .editor__preview h4, .editor__preview h5, .editor__preview h6 {
    margin: 1.4em 0 .55em;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -.01em;
  }

  .editor__preview h1 { font-size: 1.7em; }
  .editor__preview h2 { font-size: 1.4em; }
  .editor__preview h3 { font-size: 1.18em; }
  .editor__preview h4, .editor__preview h5, .editor__preview h6 { font-size: 1em; }
  .editor__preview p { margin: 0 0 .9em; }
  .editor__preview ul, .editor__preview ol { margin: 0 0 .9em; padding-left: 1.4em; }
  .editor__preview li { margin: .2em 0; }

  .editor__preview .task-list { padding-left: .2em; list-style: none; }

  .editor__preview .task-list li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .editor__preview .task-list input {
    margin-top: .38em;
    flex: none;
    accent-color: var(--accent);
  }

  .editor__preview blockquote {
    margin: 0 0 .9em;
    padding: .1em 0 .1em 14px;
    color: var(--text-muted);
    border-left: 3px solid var(--border-strong);
  }

  .editor__preview code {
    padding: .12em .38em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em;
    color: var(--text);
    background: var(--surface-2);
    border-radius: 4px;
  }

  .editor__preview pre {
    margin: 0 0 1em;
    padding: 12px 14px;
    overflow-x: auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .editor__preview pre code {
    padding: 0;
    background: none;
    font-size: .86em;
    line-height: 1.6;
  }

  .editor__preview a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .editor__preview hr {
    margin: 1.5em 0;
    border: 0;
    border-top: 1px solid var(--border);
  }

  .md-empty {
    margin: 0;
    font-size: 14px;
    color: var(--text-faint);
    font-style: italic;
  }

  /* Empty state */
  .editor__empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 40px;
    text-align: center;
  }

  .editor__empty svg { width: 40px; height: 40px; color: var(--border-strong); }

  .editor__empty h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .editor__empty p {
    margin: 0;
    max-width: 340px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-muted);
  }

  .editor__empty kbd {
    display: inline-block;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
  }

  /* Icon button */
  .icon-btn {
    display: grid;
    place-items: center;
    flex: none;
    width: 34px; height: 34px;
    color: var(--text-muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color .13s ease, color .13s ease, border-color .13s ease;
  }

  .icon-btn svg { width: 16px; height: 16px; }

  .icon-btn:hover {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: rgba(37, 99, 235, .18);
  }

  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .icon-btn.is-on {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: rgba(37, 99, 235, .28);
  }

  .icon-btn--danger:hover {
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(220, 38, 38, .2);
  }

  [data-theme="dark"] .icon-sun { display: none; }
  html:not([data-theme="dark"]) .icon-moon { display: none; }

  /* Floating exit-focus button (only when focus mode on & no note selected) */
  .focus-exit {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 80;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-sm);
    display: none;
  }

  .app.is-focus .focus-exit.is-shown { display: grid; }

  /* Context menu */
  .context-menu {
    position: fixed;
    left: 0; top: 0;
    z-index: 200;
    min-width: 220px;
    max-width: min(90vw, 320px);
    margin: 0;
    padding: 5px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    visibility: hidden;
    transform: scale(.96);
    transform-origin: top left;
    transition: opacity .1s ease, transform .1s ease, visibility .1s;
    will-change: transform, opacity;
  }

  .context-menu.is-open {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }

  .context-menu__item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 11px;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    color: var(--text);
    background: none;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .context-menu__item:hover,
  .context-menu__item:focus-visible {
    background: var(--accent-soft);
    color: var(--accent);
    outline: none;
  }

  .context-menu__item svg {
    flex: none;
    width: 15px; height: 15px;
    color: var(--text-muted);
  }

  .context-menu__item:hover svg,
  .context-menu__item:focus-visible svg { color: var(--accent); }

  .context-menu__item.is-danger { color: var(--danger); }
  .context-menu__item.is-danger svg { color: var(--danger); }
  .context-menu__item.is-danger:hover,
  .context-menu__item.is-danger:focus-visible { background: var(--danger-soft); }

  .context-menu__label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .context-menu__shortcut {
    flex: none;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
  }

  .context-menu__sep {
    height: 1px;
    margin: 5px 6px;
    background: var(--border);
  }

  /* Color swatch row */
  .context-menu__colors {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px 8px;
  }

  .context-menu__colors-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-right: 2px;
  }

  .context-menu__swatch {
    flex: none;
    width: 20px; height: 20px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    background: var(--swatch);
    transition: transform .1s ease, border-color .1s ease;
    position: relative;
    overflow: hidden;
  }

  .context-menu__swatch:hover { transform: scale(1.12); }

  .context-menu__swatch.is-selected {
    border-color: var(--text);
    box-shadow: inset 0 0 0 2px var(--surface);
  }

  .context-menu__swatch.is-none {
    background:
      linear-gradient(45deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%),
      var(--surface-2);
    border: 1px solid var(--border-strong);
  }

  /* Quick switcher */
  .quick-backdrop {
    position: fixed;
    inset: 0;
    z-index: 260;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 12vh 20px 20px;
    background: rgba(15, 23, 42, .45);
    backdrop-filter: blur(3px);
    animation: fade-in .14s ease;
  }

  .quick {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    max-height: 68vh;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: modal-in .18s cubic-bezier(.2, .8, .3, 1);
  }

  .quick__input {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .quick__input svg {
    flex: none;
    width: 18px; height: 18px;
    color: var(--text-faint);
  }

  .quick__input input {
    flex: 1;
    min-width: 0;
    padding: 0;
    font-size: 16px;
    color: var(--text);
    background: none;
    border: 0;
    outline: none;
  }

  .quick__input input::placeholder { color: var(--text-faint); }

  .quick__list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin: 0;
    padding: 6px;
    list-style: none;
  }

  .quick-switcher__item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 11px;
    font-size: 14px;
    text-align: left;
    color: var(--text);
    background: none;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  .quick-switcher__item:hover,
  .quick-switcher__item.is-focused {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .quick-switcher__text { flex: 1; min-width: 0; }

  .quick-switcher__title {
    display: block;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .quick-switcher__meta {
    display: block;
    font-size: 11.5px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .quick-switcher__item.is-focused .quick-switcher__meta { color: var(--accent); opacity: .8; }

  .quick__hint {
    padding: 8px 14px;
    font-size: 11.5px;
    color: var(--text-faint);
    background: var(--surface-2);
    border-top: 1px solid var(--border);
  }

  .quick__hint kbd {
    display: inline-block;
    padding: 0 4px;
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 3px;
  }

  /* Toast */
  .toast-stack {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: min(92vw, 420px);
    padding: 11px 14px;
    font-size: 13.5px;
    font-weight: 500;
    color: #f8fafc;
    background: #1e293b;
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    pointer-events: auto;
    animation: toast-in .22s cubic-bezier(.2, .8, .3, 1);
  }

  [data-theme="dark"] .toast {
    color: var(--text);
    border: 1px solid var(--border-strong);
  }

  .toast.is-leaving { animation: toast-out .18s ease forwards; }

  .toast__action {
    flex: none;
    padding: 4px 9px;
    font-size: 12.5px;
    font-weight: 700;
    color: #93c5fd;
    background: none;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color .13s ease;
  }

  .toast__action:hover { background: rgba(147, 197, 253, .16); }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes toast-out {
    to { opacity: 0; transform: translateY(8px) scale(.98); }
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 250;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(15, 23, 42, .45);
    backdrop-filter: blur(2px);
    animation: fade-in .15s ease;
  }

  .modal {
    width: 100%;
    max-width: 380px;
    padding: 22px 22px 18px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    animation: modal-in .18s cubic-bezier(.2, .8, .3, 1);
  }

  .modal__title {
    margin: 0 0 6px;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .modal__desc {
    margin: 0 0 18px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  .modal__actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .btn {
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color .13s ease, border-color .13s ease, color .13s ease;
  }

  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--ghost {
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
  }

  .btn--ghost:hover { background: var(--surface-2); }

  .btn--danger {
    color: #fff;
    background: var(--danger);
    border: 1px solid var(--danger);
  }

  .btn--danger:hover { filter: brightness(.92); }

  .btn--primary {
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  @keyframes modal-in {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Scrollbars */
  .note-list::-webkit-scrollbar,
  .editor__body::-webkit-scrollbar,
  .editor__preview::-webkit-scrollbar,
  .quick__list::-webkit-scrollbar { width: 10px; }

  .note-list::-webkit-scrollbar-thumb,
  .editor__body::-webkit-scrollbar-thumb,
  .editor__preview::-webkit-scrollbar-thumb,
  .quick__list::-webkit-scrollbar-thumb {
    background: var(--border);
    border: 3px solid var(--surface);
    border-radius: 10px;
  }

  .note-list::-webkit-scrollbar-thumb:hover,
  .editor__body::-webkit-scrollbar-thumb:hover,
  .editor__preview::-webkit-scrollbar-thumb:hover,
  .quick__list::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  /* Responsive */
  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 42vh) minmax(0, 1fr);
    }

    .app.is-focus { grid-template-columns: 1fr; grid-template-rows: 1fr; }

    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .editor__bar { padding: 12px 16px 10px; }
    .editor__title { font-size: 18px; }
    .editor__body, .editor__preview { padding: 16px; }
    .editor__foot { padding: 8px 16px 11px; }
    .toolbar { padding: 6px 10px; }
    .editor__stats span:first-child { display: none; }  /* hide char count on narrow screens */
  }

  /* Print */
  @media print {
    body { background: #fff; color: #000; }
    .sidebar, .editor__bar, .toolbar, .editor__foot,
    .toast-stack, .modal-backdrop, .context-menu,
    .quick-backdrop, .focus-exit { display: none !important; }
    .app { display: block; height: auto; }
    .editor { display: block; }
    .editor__pane { display: block; }
    .editor__scroll { display: block; overflow: visible; }
    .editor__body, .editor__preview {
      display: block !important;
      overflow: visible;
      padding: 0;
      height: auto;
    }
    .editor__body { display: none !important; }
    .editor__preview { display: block !important; }
    .editor__title {
      font-size: 24px;
      padding: 0 0 12px;
      border-bottom: 1px solid #ccc;
      margin-bottom: 16px;
    }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .ripple { display: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===================== Sidebar ===================== -->
  <aside class="sidebar">

    <header class="sidebar__head">

      <div class="sidebar__row">
        <h1 class="sidebar__title">
          <span id="sidebarTitle">Notes</span>
          <span class="badge" id="noteCount">0</span>
        </h1>

        <div class="sidebar__actions">
          <button type="button" class="icon-btn" id="trashBtn"
                  aria-label="Toggle trash" title="Trash">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18"/>
              <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
          </button>

          <button type="button" class="icon-btn" id="themeBtn"
                  aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>

          <div class="menu-wrap" id="appMenuWrap">
            <button type="button" class="icon-btn" id="appMenuBtn"
                    aria-haspopup="true" aria-expanded="false" aria-label="App menu" title="App menu">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="5" r="1.8"/>
                <circle cx="12" cy="12" r="1.8"/>
                <circle cx="12" cy="19" r="1.8"/>
              </svg>
            </button>
            <ul class="menu" role="menu" aria-label="App menu">
              <li role="none">
                <button type="button" role="menuitem" id="quickSwitcherBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                  </svg>
                  Quick switcher
                  <span class="menu__shortcut">⌘P</span>
                </button>
              </li>
              <li role="none"><div class="menu__sep"></div></li>
              <li role="none">
                <button type="button" role="menuitem" id="exportAllBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <path d="M7 10l5 5 5-5"/>
                    <path d="M12 15V3"/>
                  </svg>
                  Export all notes
                </button>
              </li>
              <li role="none">
                <button type="button" role="menuitem" id="importBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <path d="M17 8l-5-5-5 5"/>
                    <path d="M12 3v12"/>
                  </svg>
                  Import notes…
                </button>
              </li>
              <li role="none"><div class="menu__sep"></div></li>
              <li role="none">
                <button type="button" role="menuitem" id="clearAllBtn" class="is-danger">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                  </svg>
                  Delete all notes
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Split button: New note -->
      <div class="split-button split-button--block" id="newNoteSplit">
        <button type="button" class="split-button__main" id="newNoteBtn">New note</button>
        <button type="button" class="split-button__toggle" id="newNoteToggle"
                aria-haspopup="true" aria-expanded="false" aria-label="New note from template">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="3"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <ul class="menu" role="menu" aria-label="New note from template">
          <li role="none">
            <button type="button" role="menuitem" data-template="blank">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6"/>
              </svg>
              Blank note
              <span class="menu__shortcut">⌘N</span>
            </button>
          </li>
          <li role="none">
            <button type="button" role="menuitem" data-template="meeting">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              Meeting notes
            </button>
          </li>
          <li role="none">
            <button type="button" role="menuitem" data-template="todo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
              To-do list
            </button>
          </li>
          <li role="none">
            <button type="button" role="menuitem" data-template="idea">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 18h6"/>
                <path d="M10 22h4"/>
                <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
              </svg>
              Idea
            </button>
          </li>
        </ul>
      </div>

      <!-- Search -->
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Search notes…"
               aria-label="Search notes" autocomplete="off" spellcheck="false">
        <button type="button" class="search__clear hidden" id="searchClear" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Sort -->
      <div class="sidebar__controls">
        <label class="select">
          <span class="sr-only">Sort notes by</span>
          <select id="sortSelect">
            <option value="updated">Last updated</option>
            <option value="created">Date created</option>
            <option value="title">Title (A–Z)</option>
            <option value="color">Color</option>
          </select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </label>
      </div>
    </header>

    <div class="trash-banner hidden" id="trashBanner">
      <span>Deleted notes are kept for 30 days.</span>
      <button type="button" id="emptyTrashBtn">Empty trash</button>
    </div>

    <ul class="note-list" id="noteList" role="list"></ul>
  </aside>

  <!-- ===================== Editor ===================== -->
  <main class="editor">

    <div class="editor__empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
        <path d="M8 13h8"/>
        <path d="M8 17h5"/>
      </svg>
      <h2 id="emptyTitle">No note selected</h2>
      <p id="emptyText">
        Create a note to get started. Press <kbd>⌘N</kbd> or <kbd>Ctrl</kbd>+<kbd>N</kbd>,
        or <kbd>⌘P</kbd> to find an existing note.
      </p>
    </div>

    <div class="editor__pane hidden" id="editorPane">

      <div class="editor__bar">
        <input type="text" class="editor__title" id="titleInput"
               placeholder="Untitled note" aria-label="Note title" autocomplete="off">

        <div class="editor__actions">
          <button type="button" class="icon-btn" id="focusBtn"
                  aria-pressed="false" aria-label="Focus mode" title="Focus mode (⌘.)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 14v6h6"/>
              <path d="M20 10V4h-6"/>
              <path d="M4 4l7 7"/>
              <path d="M20 20l-7-7"/>
            </svg>
          </button>

          <button type="button" class="icon-btn" id="previewBtn"
                  aria-pressed="false" aria-label="Toggle markdown preview"
                  title="Preview markdown (⌘E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

          <button type="button" class="icon-btn" id="pinBtn"
                  aria-pressed="false" aria-label="Pin note" title="Pin note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

/* ============================================================
   1. Constants & state
   ============================================================ */

/* ============================================================
   2. Inline SVG icons
   ============================================================ */

const ICON = {

/* ============================================================
   3. Utilities
   ============================================================ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60_000)         return 'Just now';
  if (diff < 3_600_000)      return Math.floor(diff / 60_000) + 'm ago';
  if (diff < 86_400_000)     return Math.floor(diff / 3_600_000) + 'h ago';
  if (diff < 7 * 86_400_000) return Math.floor(diff / 86_400_000) + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function titleOf(note) {
  const t = (note.title || '').trim();
  return t || 'Untitled note';
}

function previewOf(note) {
  const text = (note.body || '').replace(/\s+/g, ' ').trim();
  if (!text) return 'No additional text';
  return text.length > 70 ? text.slice(0, 70) + '…' : text;
}

function countWords(text) {
  const t = (text || '').trim();
  return t ? t.split(/\s+/).length : 0;
}

function highlightMatch(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return safe;
  return escapeHtml(text.slice(0, idx))
       + '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>'
       + escapeHtml(text.slice(idx + q.length));
}

function getActiveNote() {
  return notes.find((n) => n.id === activeId) || null;
}

function isTrashed(note) {
  return !!note.deletedAt;
}

/* ============================================================
   4. Persistence
   ============================================================ */
function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];

    return parsed
      .filter((n) => n && typeof n === 'object')
      .map((n) => ({
        id:        typeof n.id === 'string' ? n.id : uid(),
        title:     typeof n.title === 'string' ? n.title : '',
        body:      typeof n.body === 'string' ? n.body : '',
        pinned:    !!n.pinned,
        color:     typeof n.color === 'string' ? n.color : '',
        deletedAt: Number(n.deletedAt) || 0,
        createdAt: Number(n.createdAt) || Date.now(),
        updatedAt: Number(n.updatedAt) || Date.now()
      }));
  } catch {
    return [];
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    return true;
  } catch {
    if (!persist._warned) {
      persist._warned = true;
      toast('Could not save — storage may be full');
    }
    return false;
  }
}

function purgeOldTrash() {
  const now = Date.now();
  const before = notes.length;
  notes = notes.filter((n) => !isTrashed(n) || (now - n.deletedAt) < TRASH_TTL);
  return notes.length !== before;
}

/* ============================================================
   5. Theme
   ============================================================ */
function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
}

function initTheme() {
  let theme;
  try { theme = localStorage.getItem(THEME_KEY); } catch {}
  if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(theme);
}

$('themeBtn').addEventListener('click', () => {
  const isDark = document.documentElement.hasAttribute('data-theme');
  applyTheme(isDark ? 'light' : 'dark');
});

/* ============================================================
   6. Ripple — global delegation
   ============================================================ */
const RIPPLE_SELECTOR = [
  '.icon-btn', '.btn', '.split-button__main', '.split-button__toggle',
  '.menu [role="menuitem"]', '.note-item', '.toast__action', '.search__clear',
  '.context-menu__item', '.toolbar__btn', '.quick-switcher__item',
  '.trash-banner button', '.context-menu__swatch', '.focus-exit'
].join(',');

const RIPPLE_DARK_SELECTOR = [
  '.icon-btn', '.btn--ghost', '.note-item', '.toast__action', '.search__clear',
  '.context-menu__item', '.menu [role="menuitem"]', '.toolbar__btn',
  '.quick-switcher__item', '.trash-banner button', '.context-menu__swatch',
  '.focus-exit'
].join(',');

function spawnRipple(el, x, y, { dark = false } = {}) {
  const rect = el.getBoundingClientRect();
  x = Math.max(0, Math.min(x, rect.width));
  y = Math.max(0, Math.min(y, rect.height));

  const radius = Math.hypot(
    Math.max(x, rect.width - x),
    Math.max(y, rect.height - y)
  );

  const ripple = document.createElement('span');
  ripple.className = dark ? 'ripple ripple--dark' : 'ripple';
  ripple.style.width = ripple.style.height = radius * 2 + 'px';
  ripple.style.left  = x - radius + 'px';
  ripple.style.top   = y - radius + 'px';

  el.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
  setTimeout(() => ripple.remove(), 800);
}

function isDarkHost(el) {
  return el.matches(RIPPLE_DARK_SELECTOR) || !!el.closest('.menu');
}

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.target.closest(RIPPLE_SELECTOR);
  if (!el) return;
  const rect = el.getBoundingClientRect();
  spawnRipple(el, e.clientX - rect.left, e.clientY - rect.top, { dark: isDarkHost(el) });
}, { passive: true });

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
  const el = e.target.closest(RIPPLE_SELECTOR);
  if (!el || el.tagName !== 'BUTTON') return;
  const rect = el.getBoundingClientRect();
  spawnRipple(el, rect.width / 2, rect.height / 2, { dark: isDarkHost(el) });
});

/* ============================================================
   7. Toast
   ============================================================ */
const toastStack = $('toastStack');

function toast(message, { action, duration = 4500 } = {}) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');

  const text = document.createElement('span');
  text.textContent = message;
  el.appendChild(text);

  let timer;

  function dismiss() {
    clearTimeout(timer);
    if (!el.isConnected) return;
    el.classList.add('is-leaving');
    el.addEventListener('animationend', () => el.remove(), { once: true });
    setTimeout(() => el.remove(), 400);
  }

  if (action) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast__action';
    btn.textContent = action.label;
    btn.addEventListener('click', () => {
      action.onClick();
      dismiss();
    });
    el.appendChild(btn);
  }

  toastStack.appendChild(el);
  timer = setTimeout(dismiss, duration);
  return dismiss;
}

/* ============================================================
   8. Confirm dialog
   ============================================================ */
const modalBackdrop = $('modalBackdrop');
const modalTitle    = $('modalTitle');
const modalDesc     = $('modalDesc');
const modalCancel   = $('modalCancel');
const modalConfirm  = $('modalConfirm');

let modalResolve = null;
let lastFocused  = null;

function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = true } = {}) {
  return new Promise((resolve) => {
    modalResolve = resolve;
    lastFocused = document.activeElement;

    modalTitle.textContent   = title || 'Are you sure?';
    modalDesc.textContent    = message || '';
    modalConfirm.textContent = confirmLabel;
    modalConfirm.className   = 'btn ' + (danger ? 'btn--danger' : 'btn--primary');

    modalBackdrop.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => modalConfirm.focus());
  });
}

function closeModal(result) {
  modalBackdrop.classList.add('hidden');
  document.body.style.overflow = '';

  const resolve = modalResolve;
  modalResolve = null;

  if (lastFocused && lastFocused.isConnected) lastFocused.focus({ preventScroll: true });
  lastFocused = null;

  if (resolve) resolve(result);
}

modalCancel.addEventListener('click', () => closeModal(false));
modalConfirm.addEventListener('click', () => closeModal(true));
modalBackdrop.addEventListener('mousedown', (e) => {
  if (e.target === modalBackdrop) closeModal(false);
});

modalBackdrop.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeModal(false); return; }
  if (e.key !== 'Tab') return;
  const focusables = [...modalBackdrop.querySelectorAll('button:not([disabled])')];
  if (!focusables.length) return;
  const first = focusables[0];
  const last  = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ============================================================
   9. Dropdown menu (wireMenu)
   ============================================================ */
function wireMenu(wrap, trigger, { onSelect } = {}) {
  const menu  = wrap.querySelector('.menu');
  const items = [...menu.querySelectorAll('[role="menuitem"]')];
  const isOpen = () => wrap.classList.contains('is-open');

  function closeAllExcept(self) {
    document.querySelectorAll('.is-open').forEach((el) => {
      if (el !== self && !el.classList.contains('context-menu')) {
        el.classList.remove('is-open');
        const t = el.querySelector('[aria-expanded="true"]');
        if (t) t.setAttribute('aria-expanded', 'false');
      }
    });
  }

  function open() {
    closeAllExcept(wrap);
    wrap.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
  }

  function close({ focusTrigger = false } = {}) {
    wrap.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
    if (focusTrigger && trigger.isConnected) trigger.focus();
  }

  trigger.addEventListener('click', () => { isOpen() ? close() : open(); });

  trigger.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); open(); items[0]?.focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); open(); items[items.length - 1]?.focus(); }
    else if (e.key === 'Escape' && isOpen()) { e.preventDefault(); e.stopPropagation(); close({ focusTrigger: true }); }
  });

  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    if (i === -1) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close({ focusTrigger: true }); }
    else if (e.key === 'Tab') close();
  });

  items.forEach((item) => {
    item.addEventListener('click', () => {
      const cb = onSelect;
      close({ focusTrigger: true });
      cb?.(item);
    });
  });

  document.addEventListener('click', (e) => {
    if (isOpen() && !wrap.contains(e.target)) close();
  });

  wrap.addEventListener('focusout', (e) => {
    if (!wrap.contains(e.relatedTarget)) close();
  });

  return { open, close, isOpen, items, trigger, menu };
}

/* ============================================================
   10. Context menu
   ============================================================ */
const contextMenu = $('contextMenu');
let contextMenuCleanup = [];
let lastContextFocus = null;

function showContextMenu(x, y, items) {
  hideContextMenu({ silent: true });
  contextMenu.innerHTML = '';

  items.forEach((item) => {
    if (item.type === 'separator') {
      const sep = document.createElement('div');
      sep.className = 'context-menu__sep';
      sep.setAttribute('role', 'separator');
      contextMenu.appendChild(sep);
      return;
    }

    if (item.type === 'colors') {
      const row = document.createElement('div');
      row.className = 'context-menu__colors';
      const label = document.createElement('span');
      label.className = 'context-menu__colors-label';
      label.textContent = 'Color';
      row.appendChild(label);

      COLORS.forEach((c) => {
        const sw = document.createElement('button');
        sw.type = 'button';
        sw.className = 'context-menu__swatch'
          + (c.hex ? '' : ' is-none')
          + (item.current === c.hex ? ' is-selected' : '');
        sw.setAttribute('aria-label', c.name);
        sw.title = c.name;
        sw.dataset.hex = c.hex;
        if (c.hex) sw.style.setProperty('--swatch', c.hex);
        sw.addEventListener('click', () => {
          hideContextMenu();
          setTimeout(() => item.onPick?.(c.hex), 0);
        });
        row.appendChild(sw);
      });

      contextMenu.appendChild(row);
      return;
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role', 'menuitem');
    btn.className = 'context-menu__item' + (item.danger ? ' is-danger' : '');
    btn.innerHTML =
      (item.icon || '') +
      '<span class="context-menu__label">' + escapeHtml(item.label) + '</span>' +
      (item.shortcut ? '<span class="context-menu__shortcut">' + escapeHtml(item.shortcut) + '</span>' : '');

    btn.addEventListener('click', () => {
      hideContextMenu();
      setTimeout(() => item.action?.(), 0);
    });

    contextMenu.appendChild(btn);
  });

  lastContextFocus = document.activeElement;

  contextMenu.setAttribute('aria-hidden', 'false');
  contextMenu.style.left = '-9999px';
  contextMenu.style.top  = '-9999px';
  contextMenu.classList.add('is-open');

  // Use offsetWidth/offsetHeight so we ignore the scale(.96) transform
  const menuW = contextMenu.offsetWidth;
  const menuH = contextMenu.offsetHeight;

  const pad = 8;
  const vw  = window.innerWidth;
  const vh  = window.innerHeight;

  let left = x, top = y;
  if (left + menuW + pad > vw) left = Math.max(pad, vw - menuW - pad);
  if (top  + menuH + pad > vh) top  = Math.max(pad, vh - menuH - pad);
  if (left < pad) left = pad;
  if (top  < pad) top  = pad;

  contextMenu.style.left = left + 'px';
  contextMenu.style.top  = top  + 'px';

  const first = contextMenu.querySelector('.context-menu__item');
  if (first) first.focus({ preventScroll: true });

  const onDocPointer = (e) => {
    if (!contextMenu.contains(e.target)) hideContextMenu();
  };
  const onDocKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hideContextMenu({ focusBack: true }); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const list = [...contextMenu.querySelectorAll('.context-menu__item')];
      const i = list.indexOf(document.activeElement);
      if (i === -1) return;
      const next = e.key === 'ArrowDown'
        ? (i + 1) % list.length
        : (i - 1 + list.length) % list.length;
      list[next].focus();
      return;
    }
    if (e.key === 'Home') { e.preventDefault(); contextMenu.querySelector('.context-menu__item')?.focus(); return; }
    if (e.key === 'End') {
      e.preventDefault();
      const list = contextMenu.querySelectorAll('.context-menu__item');
      list[list.length - 1]?.focus();
      return;
    }
    if (e.key === 'Tab') hideContextMenu();
  };
  const onScroll = () => hideContextMenu();
  const onResize = () => hideContextMenu();

  document.addEventListener('pointerdown', onDocPointer, true);
  document.addEventListener('keydown', onDocKey, true);
  window.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', onResize);

  contextMenuCleanup = [
    () => document.removeEventListener('pointerdown', onDocPointer, true),
    () => document.removeEventListener('keydown', onDocKey, true),
    () => window.removeEventListener('scroll', onScroll, true),
    () => window.removeEventListener('resize', onResize)
  ];
}

function hideContextMenu({ focusBack = false, silent = false } = {}) {
  const wasOpen = contextMenu.classList.contains('is-open');
  contextMenu.classList.remove('is-open');
  contextMenu.setAttribute('aria-hidden', 'true');

  contextMenuCleanup.forEach((fn) => fn());
  contextMenuCleanup = [];

  if (wasOpen && focusBack && lastContextFocus && lastContextFocus.isConnected) {
    lastContextFocus.focus({ preventScroll: true });
  }
  lastContextFocus = null;

  if (!silent) {
    setTimeout(() => {
      if (!contextMenu.classList.contains('is-open')) contextMenu.innerHTML = '';
    }, 150);
  }
}

/* ============================================================
   12. Sorting & filtering
   ============================================================ */
function colorIndex(note) {
  const i = COLORS.findIndex((c) => c.hex === note.color);
  return i === -1 ? 0 : i;
}

function sortedNotes() {
  const arr = [...notes];
  arr.sort((a, b) => {
    if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
    if (sortMode === 'title')   return titleOf(a).localeCompare(titleOf(b), undefined, { sensitivity: 'base' });
    if (sortMode === 'created') return b.createdAt - a.createdAt;
    if (sortMode === 'color')   return colorIndex(a) - colorIndex(b) || b.updatedAt - a.updatedAt;
    return b.updatedAt - a.updatedAt;
  });
  return arr;
}

function filteredNotes() {
  const q = query.trim().toLowerCase();
  const base = sortedNotes().filter((n) =>
    sidebarView === 'trash' ? isTrashed(n) : !isTrashed(n)
  );
  if (!q) return base;
  return base.filter((n) =>
    (n.title || '').toLowerCase().includes(q) ||
    (n.body  || '').toLowerCase().includes(q)
  );
}

/* ============================================================
   13. Markdown renderer
   ============================================================ */
function renderMarkdown(src) {
  if (!src || !src.trim()) return '<p class="md-empty">Nothing to preview yet.</p>';

  const codeBlocks = [];
  let text = src.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\n/, ''));
    return '\u0000CODE' + (codeBlocks.length - 1) + '\u0000';
  });

  text = escapeHtml(text);
  const lines = text.split('\n');
  const out = [];
  let listType = null;
  let inQuote = false;

  const closeList  = () => { if (listType) { out.push('</' + listType + '>'); listType = null; } };
  const closeQuote = () => { if (inQuote) { out.push('</blockquote>'); inQuote = false; } };

  for (const line of lines) {
    const codeMatch = line.match(/^\u0000CODE(\d+)\u0000$/);
    if (codeMatch) {
      closeList(); closeQuote();
      out.push('<pre><code>' + escapeHtml(codeBlocks[+codeMatch[1]]) + '</code></pre>');
      continue;
    }
    if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
      closeList(); closeQuote(); out.push('<hr>'); continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList(); closeQuote();
      const level = h[1].length;
      out.push('<h' + level + '>' + inline(h[2]) + '</h' + level + '>');
      continue;
    }
    const q = line.match(/^&gt;\s?(.*)$/);
    if (q) {
      closeList();
      if (!inQuote) { out.push('<blockquote>'); inQuote = true; }
      out.push('<p>' + inline(q[1]) + '</p>');
      continue;
    } else closeQuote();

    const task = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if (task) {
      closeQuote();
      if (listType !== 'ul') { closeList(); out.push('<ul class="task-list">'); listType = 'ul'; }
      const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
      out.push('<li><input type="checkbox" disabled' + checked + '><span>' + inline(task[2]) + '</span></li>');
      continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) {
      closeQuote();
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
      continue;
    }

    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      closeQuote();
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>');
      continue;
    }

    if (!line.trim()) { closeList(); closeQuote(); continue; }

    closeList(); closeQuote();
    out.push('<p>' + inline(line) + '</p>');
  }

  closeList(); closeQuote();
  return out.join('\n');

  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
}

function updateNoteCount() {
  const n = sidebarView === 'trash'
    ? notes.filter(isTrashed).length
    : notes.filter((x) => !isTrashed(x)).length;
  noteCountEl.textContent = String(n);
  noteCountEl.classList.toggle('badge--danger', sidebarView === 'trash');
}

function renderList() {
  const visible = filteredNotes();
  const q = query.trim();

  listEl.innerHTML = '';
  updateNoteCount();

  sidebarTitle.textContent = sidebarView === 'trash' ? 'Trash' : 'Notes';
  trashBanner.classList.toggle('hidden', sidebarView !== 'trash');

  if (!visible.length) {
    const li = document.createElement('li');
    li.className = 'list-empty';
    li.textContent = sidebarView === 'trash'
      ? (q ? 'No deleted notes match.' : 'Trash is empty.')
      : (q ? 'No notes match your search.' : 'No notes yet. Use “New note” to add one.');
    listEl.appendChild(li);
    return;
  }

  const frag = document.createDocumentFragment();

  visible.forEach((note) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'listitem');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'note-item'
      + (note.id === activeId ? ' is-active' : '')
      + (note.pinned ? ' is-pinned' : '')
      + (note.color ? ' has-color' : '');
    btn.dataset.id = note.id;
    btn.setAttribute('aria-current', note.id === activeId ? 'true' : 'false');
    if (note.color) btn.style.setProperty('--note-color', note.color);

    btn.innerHTML =
      '<div class="note-item__top">' +
        '<span class="note-item__title">' + highlightMatch(titleOf(note), q) + '</span>' +
        PIN_SVG +
      '</div>' +
      '<div class="note-item__preview">' + highlightMatch(previewOf(note), q) + '</div>' +
      '<div class="note-item__time">' +
        escapeHtml(formatTime(note.updatedAt)) +
        (isTrashed(note) ? ' · deleted ' + escapeHtml(formatTime(note.deletedAt)) : '') +
      '</div>';

    btn.addEventListener('click', () => {
      if (activeId === note.id) return;
      selectNote(note.id);
    });

    li.appendChild(btn);

function updateListRow(note) {
  const btn = listEl.querySelector('.note-item[data-id="' + note.id + '"]');
  if (!btn) return;
  btn.classList.toggle('is-pinned', !!note.pinned);
  btn.classList.toggle('has-color', !!note.color);
  if (note.color) btn.style.setProperty('--note-color', note.color);
  else btn.style.removeProperty('--note-color');
  btn.querySelector('.note-item__title').textContent   = titleOf(note);
  btn.querySelector('.note-item__preview').textContent = previewOf(note);
  btn.querySelector('.note-item__time').textContent    = formatTime(note.updatedAt);
}

/* ============================================================
   15. Editor rendering
   ============================================================ */
function renderEditor() {
  const note = getActiveNote();

  if (!note || isTrashed(note)) {
    editorPane.classList.add('hidden');
    emptyState.classList.remove('hidden');

    if (sidebarView === 'trash') {
      const trashed = notes.filter(isTrashed).length;
      if (trashed === 0) {
        emptyTitle.textContent = 'Trash is empty';
        emptyText.innerHTML = 'Deleted notes will appear here for 30 days before being removed automatically.';
      } else {
        emptyTitle.textContent = 'Deleted notes';
        emptyText.innerHTML = 'Restore a note from the trash to edit it, or empty the trash to delete it permanently.';
      }
    } else if (notes.some((n) => !isTrashed(n))) {
      emptyTitle.textContent = 'No note selected';
      emptyText.innerHTML = 'Pick a note from the list, or create a new one with <kbd>⌘N</kbd>.';
    } else {
      emptyTitle.textContent = 'No notes yet';
      emptyText.innerHTML = 'Create your first note to get started. Everything is saved in your browser.';
    }
    updateFocusExit();
    return;
  }

  emptyState.classList.add('hidden');
  editorPane.classList.remove('hidden');

  if (document.activeElement !== titleInput) titleInput.value = note.title;
  if (document.activeElement !== bodyInput)  bodyInput.value  = note.body;

  pinBtn.classList.toggle('is-on', !!note.pinned);
  pinBtn.setAttribute('aria-pressed', String(!!note.pinned));
  pinBtn.setAttribute('aria-label', note.pinned ? 'Unpin note' : 'Pin note');
  pinBtn.title = note.pinned ? 'Unpin note' : 'Pin note';

  updateStats();
  refreshPreview();
  setStatus('saved');
  updateFocusExit();
}

function updateStats() {
  const text = bodyInput.value;
  const words = countWords(text);
  const chars = text.length;
  const minutes = Math.max(1, Math.round(words / 200));

  wordCountEl.textContent = words === 1 ? '1 word' : words + ' words';
  charCountEl.textContent = chars === 1 ? '1 char' : chars + ' chars';
  readTimeEl.textContent  = words === 0 ? '0 min read' : minutes + ' min read';
}

function setStatus(kind, message) {
  if (kind === 'saving') {
    statusDot.classList.add('is-saving');
    statusText.textContent = 'Saving…';
  } else if (kind === 'error') {
    statusDot.classList.remove('is-saving');
    statusText.textContent = message || 'Could not save';
  } else {
    statusDot.classList.remove('is-saving');
    statusText.textContent = message || 'Saved';
  }
}

/* ============================================================
   16. Preview mode + focus mode
   ============================================================ */
function refreshPreview() {
  if (!previewMode) return;
  previewPane.innerHTML = renderMarkdown(bodyInput.value);
}

function applyPreviewMode() {
  previewBtn.classList.toggle('is-on', previewMode);
  previewBtn.setAttribute('aria-pressed', String(previewMode));
  previewBtn.title = previewMode ? 'Edit note (⌘E)' : 'Preview markdown (⌘E)';

  bodyInput.classList.toggle('hidden', previewMode);
  previewPane.classList.toggle('hidden', !previewMode);
  toolbar.classList.toggle('hidden', previewMode);

  refreshPreview();
}

function togglePreview() {
  const note = getActiveNote();
  if (!note || isTrashed(note)) return;
  previewMode = !previewMode;
  applyPreviewMode();
}

previewBtn.addEventListener('click', togglePreview);

function applyFocusMode() {
  app.classList.toggle('is-focus', focusMode);
  focusBtn.classList.toggle('is-on', focusMode);
  focusBtn.setAttribute('aria-pressed', String(focusMode));
  focusBtn.title = focusMode ? 'Exit focus mode (⌘.)' : 'Focus mode (⌘.)';
  try { localStorage.setItem(FOCUS_KEY, focusMode ? '1' : '0'); } catch {}
  updateFocusExit();
}

function updateFocusExit() {
  // Show the floating exit button only when focus mode is on AND no editable note is visible
  const note = getActiveNote();
  const showFloating = focusMode && (!note || isTrashed(note));
  focusExitBtn.classList.toggle('is-shown', showFloating);
}

focusBtn.addEventListener('click', () => {
  focusMode = !focusMode;
  applyFocusMode();
});

focusExitBtn.addEventListener('click', () => {
