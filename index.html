/* ============================================================
   12. Sorting & filtering
   ============================================================ */
function sortedNotes() {
  const arr = [...notes];
  arr.sort((a, b) => {
    if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
    if (sortMode === 'title')   return titleOf(a).localeCompare(titleOf(b), undefined, { sensitivity: 'base' });
    if (sortMode === 'created') return b.createdAt - a.createdAt;
    return b.updatedAt - a.updatedAt;
  });
  return arr;
}

function filteredNotes() {
  const q = query.trim().toLowerCase();
  const sorted = sortedNotes();
  if (!q) return sorted;
  return sorted.filter((n) =>
    (n.title || '').toLowerCase().includes(q) ||
    (n.body  || '').toLowerCase().includes(q)
  );
}

/* ============================================================
   13. Markdown renderer
   ============================================================ */
function renderMarkdown(src) {
  if (!src || !src.trim()) {
    return '<p class="md-empty">Nothing to preview yet.</p>';
  }

  const codeBlocks = [];
  let text = src.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\n/, ''));
    return '\u0000CODE' + (codeBlocks.length - 1) + '\u0000';
  });

  text = escapeHtml(text);

  const lines = text.split('\n');
  const out = [];
  let listType = null;
  let inQuote = false;

  const closeList  = () => { if (listType) { out.push('</' + listType + '>'); listType = null; } };
  const closeQuote = () => { if (inQuote) { out.push('</blockquote>'); inQuote = false; } };

  for (const line of lines) {
    const codeMatch = line.match(/^\u0000CODE(\d+)\u0000$/);
    if (codeMatch) {
      closeList(); closeQuote();
      out.push('<pre><code>' + escapeHtml(codeBlocks[+codeMatch[1]]) + '</code></pre>');
      continue;
    }

    if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
      closeList(); closeQuote();
      out.push('<hr>');
      continue;
    }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList(); closeQuote();
      const level = h[1].length;
      out.push('<h' + level + '>' + inline(h[2]) + '</h' + level + '>');
      continue;
    }

    const q = line.match(/^&gt;\s?(.*)$/);
    if (q) {
      closeList();
      if (!inQuote) { out.push('<blockquote>'); inQuote = true; }
      out.push('<p>' + inline(q[1]) + '</p>');
      continue;
    } else {
      closeQuote();
    }

    const task = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if (task) {
      closeQuote();
      if (listType !== 'ul') { closeList(); out.push('<ul class="task-list">'); listType = 'ul'; }
      const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
      out.push('<li><input type="checkbox" disabled' + checked + '><span>' + inline(task[2]) + '</span></li>');
      continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) {
      closeQuote();
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
      continue;
    }

    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      closeQuote();
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>');
      continue;
    }

    if (!line.trim()) {
      closeList(); closeQuote();
      continue;
    }

    closeList(); closeQuote();
    out.push('<p>' + inline(line) + '</p>');
  }

  closeList(); closeQuote();
  return out.join('\n');

  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
}

/* ============================================================
   14. List rendering
   ============================================================ */
const PIN_SVG = '<svg class="note-item__pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M12 17v5"/>' +
  '<path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>' +
  '</svg>';

function updateNoteCount() {
  noteCountEl.textContent = String(notes.length);
}

function renderList() {
  const visible = filteredNotes();
  const q = query.trim();

  listEl.innerHTML = '';
  updateNoteCount();

  if (!visible.length) {
    const li = document.createElement('li');
    li.className = 'list-empty';
    li.textContent = q
      ? 'No notes match your search.'
      : 'No notes yet. Use “New note” to add one.';
    listEl.appendChild(li);
    return;
  }

  const frag = document.createDocumentFragment();

  visible.forEach((note) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'listitem');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'note-item'
      + (note.id === activeId ? ' is-active' : '')
      + (note.pinned ? ' is-pinned' : '');
    btn.dataset.id = note.id;
    btn.setAttribute('aria-current', note.id === activeId ? 'true' : 'false');

    btn.innerHTML =
      '<div class="note-item__top">' +
        '<span class="note-item__title">' + highlightMatch(titleOf(note), q) + '</span>' +
        PIN_SVG +
      '</div>' +
      '<div class="note-item__preview">' + highlightMatch(previewOf(note), q) + '</div>' +
      '<div class="note-item__time">' + escapeHtml(formatTime(note.updatedAt)) + '</div>';

    btn.addEventListener('click', () => {
      if (activeId === note.id) return;
      selectNote(note.id);
    });

    li.appendChild(btn);
    frag.appendChild(li);
  });

  listEl.appendChild(frag);
}

function updateListRow(note) {
  const btn = listEl.querySelector('.note-item[data-id="' + note.id + '"]');
  if (!btn) return;

  btn.classList.toggle('is-pinned', !!note.pinned);
  btn.querySelector('.note-item__title').textContent   = titleOf(note);
  btn.querySelector('.note-item__preview').textContent = previewOf(note);
  btn.querySelector('.note-item__time').textContent    = formatTime(note.updatedAt);
}

/* ============================================================
   15. Editor rendering
   ============================================================ */
function renderEditor() {
  const note = getActiveNote();

  if (!note) {
    editorPane.classList.add('hidden');
    emptyState.classList.remove('hidden');
    emptyTitle.textContent = notes.length ? 'No note selected' : 'No notes yet';
    emptyText.innerHTML = notes.length
      ? 'Pick a note from the list, or create a new one with <kbd>⌘N</kbd>.'
      : 'Create your first note to get started. Everything is saved in your browser.';
    return;
  }

  emptyState.classList.add('hidden');
  editorPane.classList.remove('hidden');

  if (document.activeElement !== titleInput) titleInput.value = note.title;
  if (document.activeElement !== bodyInput)  bodyInput.value  = note.body;

  pinBtn.classList.toggle('is-on', !!note.pinned);
  pinBtn.setAttribute('aria-pressed', String(!!note.pinned));
  pinBtn.setAttribute('aria-label', note.pinned ? 'Unpin note' : 'Pin note');
  pinBtn.title = note.pinned ? 'Unpin note' : 'Pin note';

  updateWordCount();
  refreshPreview();
  setStatus('saved');
}

function updateWordCount() {
  const n = countWords(bodyInput.value);
  wordCountEl.textContent = n === 1 ? '1 word' : n + ' words';
}

function setStatus(kind, message) {
  if (kind === 'saving') {
    statusDot.classList.add('is-saving');
    statusText.textContent = 'Saving…';
  } else if (kind === 'error') {
    statusDot.classList.remove('is-saving');
    statusText.textContent = message || 'Could not save';
  } else {
    statusDot.classList.remove('is-saving');
    statusText.textContent = message || 'Saved';
  }
}

/* ============================================================
   16. Preview mode
   ============================================================ */
function refreshPreview() {
  if (!previewMode) return;
  previewPane.innerHTML = renderMarkdown(bodyInput.value);
}

function applyPreviewMode() {
  previewBtn.classList.toggle('is-on', previewMode);
  previewBtn.setAttribute('aria-pressed', String(previewMode));
  previewBtn.title = previewMode ? 'Edit note (⌘E)' : 'Preview markdown (⌘E)';

  bodyInput.classList.toggle('hidden', previewMode);
  previewPane.classList.toggle('hidden', !previewMode);

  refreshPreview();
}

function togglePreview() {
  if (!getActiveNote()) return;
  previewMode = !previewMode;
  applyPreviewMode();
}

previewBtn.addEventListener('click', togglePreview);

/* ============================================================
   17. Note actions
   ============================================================ */
function selectNote(id) {
  if (activeId === id) return;
  activeId = id;
  renderList();
  renderEditor();
}

function createNote(templateKey = 'blank') {
  const tpl = TEMPLATES[templateKey] || TEMPLATES.blank;
  const now = Date.now();

  const note = {
    id: uid(),
    title: tpl.title,
    body: tpl.body,
    pinned: false,
    createdAt: now,
    updatedAt: now
  };

  notes.unshift(note);
  activeId = note.id;

  persist();
  renderList();
  renderEditor();

  requestAnimationFrame(() => {
    if (tpl.title) {
      bodyInput.focus();
      const len = bodyInput.value.length;
      bodyInput.setSelectionRange(len, len);
    } else {
      titleInput.focus();
    }
  });
}

function togglePinNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  note.pinned = !note.pinned;
  note.updatedAt = Date.now();

  persist();
  renderList();
  if (activeId === id) renderEditor();
  toast(note.pinned ? 'Note pinned' : 'Note unpinned');
}

function duplicateNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  const now = Date.now();
  const copy = {
    id: uid(),
    title: note.title ? note.title + ' (copy)' : '',
    body: note.body,
    pinned: false,
    createdAt: now,
    updatedAt: now
  };

  const index = notes.findIndex((n) => n.id === id);
  notes.splice(index + 1, 0, copy);
  activeId = copy.id;

  persist();
  renderList();
  renderEditor();
  toast('Note duplicated');
}

async function copyNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  const text = titleOf(note) + '\n\n' + (note.body || '');

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity  = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('Copied to clipboard');
  } catch {
    toast('Could not copy');
  }
}

function downloadNote(note) {
  if (!note) return;
  const md = '# ' + titleOf(note) + '\n\n' + (note.body || '');
  const safeName = titleOf(note)
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .toLowerCase() || 'note';

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = safeName + '.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Note downloaded');
}

async function deleteNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  const ok = await confirmDialog({
    title: 'Delete note?',
    message: '“' + titleOf(note) + '” will be permanently deleted.',
    confirmLabel: 'Delete'
  });
  if (!ok) return;

  const index = notes.findIndex((n) => n.id === id);
  const [removed] = notes.splice(index, 1);
  lastDeleted = { note: removed, index };

  const remaining = filteredNotes();
  activeId = remaining.length ? remaining[0].id : null;

  persist();
  renderList();
  renderEditor();

  toast('Note deleted', {
    action: {
      label: 'Undo',
      onClick: () => {
        if (!lastDeleted) return;
        const { note: n, index: idx } = lastDeleted;
        notes.splice(Math.min(idx, notes.length), 0, n);
        activeId = n.id;
        lastDeleted = null;
        persist();
        renderList();
        renderEditor();
        toast('Note restored');
      }
    },
    duration: 6000
  });
}

/* ============================================================
   18. Editing & autosave
   ============================================================ */
function scheduleSave({ resort = false } = {}) {
  setStatus('saving');

  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ok = persist();
    setStatus(ok ? 'saved' : 'error', ok ? 'Saved' : 'Could not save');
  }, SAVE_DELAY);

  if (resort) {
    clearTimeout(listResortTimer);
    listResortTimer = setTimeout(() => {
      if (sortMode === 'title') return;
      if (document.activeElement && (document.activeElement === titleInput || document.activeElement === bodyInput)) return;
      renderList();
    }, 1400);
  }
}

function handleEdit(field, value) {
  const note = getActiveNote();
  if (!note) return;

  note[field] = value;
  note.updatedAt = Date.now();

  if (query.trim()) {
    renderList();
  } else {
    updateListRow(note);
  }

  if (field === 'body') {
    updateWordCount();
    if (previewMode) refreshPreview();
  }

  scheduleSave({ resort: true });
}

titleInput.addEventListener('input', () => handleEdit('title', titleInput.value));
bodyInput.addEventListener('input',  () => handleEdit('body',  bodyInput.value));

function flushSave() {
  clearTimeout(saveTimer);
  persist();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});

window.addEventListener('beforeunload', flushSave);

/* ============================================================
   19. Split button (New note)
   ============================================================ */
const newNoteSplit  = $('newNoteSplit');
const newNoteBtn    = $('newNoteBtn');
const newNoteToggle = $('newNoteToggle');

wireMenu(newNoteSplit, newNoteToggle, {
  onSelect: (item) => createNote(item.dataset.template || 'blank')
});

newNoteBtn.addEventListener('click', () => createNote('blank'));

/* ============================================================
   20. Editor "more" menu + pin button
   ============================================================ */
wireMenu($('moreWrap'), $('moreBtn'), {
  onSelect: (item) => {
    switch (item.id) {
      case 'dupBtn':       duplicateNote(activeId);          break;
      case 'copyBtn':      copyNote(activeId);               break;
      case 'exportOneBtn': downloadNote(getActiveNote());    break;
      case 'deleteBtn':    deleteNote(activeId);             break;
    }
  }
});

pinBtn.addEventListener('click', () => togglePinNote(activeId));

/* ============================================================
   21. App menu (export / import / clear)
   ============================================================ */
wireMenu($('appMenuWrap'), $('appMenuBtn'), {
  onSelect: (item) => {
    switch (item.id) {
      case 'exportAllBtn': exportAllNotes();     break;
      case 'importBtn':    importInput.click();  break;
      case 'clearAllBtn':  clearAllNotes();      break;
    }
  }
});

function exportAllNotes() {
  if (!notes.length) { toast('No notes to export'); return; }

  const payload = { version: 3, exportedAt: new Date().toISOString(), notes };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'notes-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  toast('Exported ' + notes.length + (notes.length === 1 ? ' note' : ' notes'));
}

importInput.addEventListener('change', async () => {
  const file = importInput.files && importInput.files[0];
  importInput.value = '';
  if (!file) return;

  try {
    const text   = await file.text();
    const parsed = JSON.parse(text);
    const incoming = Array.isArray(parsed)
      ? parsed
      : (parsed && Array.isArray(parsed.notes) ? parsed.notes : null);
    if (!incoming) throw new Error('Invalid format');

    const existingIds = new Set(notes.map((n) => n.id));
    let added = 0;

    incoming.forEach((raw) => {
      if (!raw || typeof raw !== 'object') return;
      const now = Date.now();
      let id = typeof raw.id === 'string' && raw.id ? raw.id : uid();
      if (existingIds.has(id)) id = uid();
      existingIds.add(id);

      notes.push({
        id,
        title:     typeof raw.title === 'string' ? raw.title : '',
        body:      typeof raw.body  === 'string' ? raw.body  : '',
        pinned:    !!raw.pinned,
        createdAt: Number(raw.createdAt) || now,
        updatedAt: Number(raw.updatedAt) || now
      });
      added++;
    });

    if (!added) { toast('No valid notes found'); return; }

    if (!activeId) activeId = sortedNotes()[0].id;

    persist();
    renderList();
    renderEditor();
    toast('Imported ' + added + (added === 1 ? ' note' : ' notes'));
  } catch {
    toast('Could not read that file');
  }
});

async function clearAllNotes() {
  if (!notes.length) { toast('No notes to delete'); return; }

  const ok = await confirmDialog({
    title: 'Delete all notes?',
    message: 'All ' + notes.length + ' notes will be permanently removed.',
    confirmLabel: 'Delete all'
  });
  if (!ok) return;

  notes = [];
  activeId = null;
  lastDeleted = null;

  persist();
  renderList();
  renderEditor();
  toast('All notes deleted');
}

/* ============================================================
   22. Search
   ============================================================ */
searchInput.addEventListener('input', () => {
  query = searchInput.value;
  searchClear.classList.toggle('hidden', !query);
  renderList();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  searchClear.classList.add('hidden');
  renderList();
  searchInput.focus();
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    if (query) {
      searchInput.value = '';
      query = '';
      searchClear.classList.add('hidden');
      renderList();
    } else {
      searchInput.blur();
    }
  } else if (e.key === 'Enter') {
    const first = listEl.querySelector('.note-item');
    if (first) {
      first.click();
      first.focus();
    }
  }
});

/* ============================================================
   23. Sort
   ============================================================ */
try {
  const stored = localStorage.getItem(SORT_KEY);
  if (stored && ['updated', 'created', 'title'].includes(stored)) sortMode = stored;
} catch {}

sortSelect.value = sortMode;

sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  try { localStorage.setItem(SORT_KEY, sortMode); } catch {}
  renderList();
});

/* ============================================================
   24. List keyboard navigation
   ============================================================ */
listEl.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;

  const items = [...listEl.querySelectorAll('.note-item')];
  const i = items.indexOf(document.activeElement);
  if (i === -1) return;

  e.preventDefault();
  const next = e.key === 'ArrowDown' ? items[i + 1] : items[i - 1];
  if (next) {
    next.focus();
    next.click();
  }
});

/* ============================================================
   25. Context menu — right-click + long-press
   ============================================================ */
function showNoteContextMenu(x, y, noteId) {
  const note = notes.find((n) => n.id === noteId);
  if (!note) return;

  showContextMenu(x, y, [
    { label: 'Open',  icon: ICON.open, action: () => selectNote(noteId) },
    {
      label: note.pinned ? 'Unpin' : 'Pin',
      icon: ICON.pin,
      action: () => togglePinNote(noteId)
    },
    { type: 'separator' },
    { label: 'Duplicate',         icon: ICON.duplicate, shortcut: IS_MAC ? '⌘D' : 'Ctrl+D', action: () => duplicateNote(noteId) },
    { label: 'Copy to clipboard', icon: ICON.copy,      action: () => copyNote(noteId) },
    { label: 'Download as .md',   icon: ICON.download,  action: () => downloadNote(note) },
    { type: 'separator' },
    { label: 'Delete', icon: ICON.del, danger: true, action: () => deleteNote(noteId) }
  ]);
}

function showListEmptyContextMenu(x, y) {
  showContextMenu(x, y, [
    { label: 'New note',       icon: ICON.newNote, shortcut: IS_MAC ? '⌘N' : 'Ctrl+N', action: () => createNote('blank') },
    { label: 'Meeting notes',  icon: ICON.meeting, action: () => createNote('meeting') },
    { label: 'To-do list',     icon: ICON.todo,    action: () => createNote('todo') },
    { label: 'Idea',           icon: ICON.idea,    action: () => createNote('idea') },
    { type: 'separator' },
    { label: 'Export all notes', icon: ICON.download, action: exportAllNotes },
    { label: 'Import notes…',    icon: ICON.upload,   action: () => importInput.click() }
  ]);
}

function showEditorContextMenu(x, y) {
  const note = getActiveNote();
  if (!note) return;

  showContextMenu(x, y, [
    {
      label: previewMode ? 'Edit note' : 'Preview markdown',
      icon: previewMode ? ICON.edit : ICON.eye,
      shortcut: IS_MAC ? '⌘E' : 'Ctrl+E',
      action: togglePreview
    },
    { type: 'separator' },
    { label: 'Duplicate',         icon: ICON.duplicate, shortcut: IS_MAC ? '⌘D' : 'Ctrl+D', action: () => duplicateNote(note.id) },
    { label: 'Copy to clipboard', icon: ICON.copy,      action: () => copyNote(note.id) },
    { label: 'Download as .md',   icon: ICON.download,  action: () => downloadNote(note) },
    { type: 'separator' },
    { label: 'Delete note', icon: ICON.del, danger: true, action: () => deleteNote(note.id) }
  ]);
}

/* ---- Right-click handlers ---- */

listEl.addEventListener('contextmenu', (e) => {
  const item = e.target.closest('.note-item');
  e.preventDefault();

  // Browser's own contextmenu may fire after a touch long-press on some devices —
  // don't double-open.
  if (contextMenu.classList.contains('is-open')) return;

  if (item) {
    showNoteContextMenu(e.clientX, e.clientY, item.dataset.id);
  } else {
    showListEmptyContextMenu(e.clientX, e.clientY);
  }
});

$('editorPane').addEventListener('contextmenu', (e) => {
  // Let native menu show in inputs so cut/copy/paste still work
  if (e.target.closest('input, textarea')) return;
  e.preventDefault();
  if (contextMenu.classList.contains('is-open')) return;
  showEditorContextMenu(e.clientX, e.clientY);
});

// Prevent accidental native menu elsewhere in the app
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('.menu, .modal-backdrop, .toast-stack, input, textarea')) return;
  if (e.target.closest('.sidebar__head, .editor')) e.preventDefault();
});

/* ---- Long-press (touch) handler ---- */

let lpTimer = null;
let lpStart = null;
let lpFiredAt = 0;

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  const item = e.target.closest('.note-item');
  if (!item) return;

  lpStart = { x: e.clientX, y: e.clientY, id: item.dataset.id };
  clearTimeout(lpTimer);

  lpTimer = setTimeout(() => {
    lpFiredAt = Date.now();
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
    showNoteContextMenu(lpStart.x, lpStart.y, lpStart.id);
  }, 480);
}, { passive: true });

document.addEventListener('pointermove', (e) => {
  if (!lpTimer || !lpStart) return;
  const dx = e.clientX - lpStart.x;
  const dy = e.clientY - lpStart.y;
  if (Math.hypot(dx, dy) > 8) {
    clearTimeout(lpTimer);
    lpTimer = null;
    lpStart = null;
  }
}, { passive: true });

document.addEventListener('pointerup', () => {
  clearTimeout(lpTimer);
  lpTimer = null;
  lpStart = null;
}, { passive: true });

document.addEventListener('pointercancel', () => {
  clearTimeout(lpTimer);
  lpTimer = null;
  lpStart = null;
}, { passive: true });

// Suppress the click that follows a long-press
document.addEventListener('click', (e) => {
  if (lpFiredAt && Date.now() - lpFiredAt < 600) {
    e.preventDefault();
    e.stopPropagation();
    lpFiredAt = 0;
  }
}, true);

/* ============================================================
   26. Global keyboard shortcuts
   ============================================================ */
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

document.addEventListener('keydown', (e) => {
  // Modal handles its own keys
  if (!modalBackdrop.classList.contains('hidden')) return;
  // Context menu has its own key handling
  if (contextMenu.classList.contains('is-open')) return;
  // Don't re-handle something a nested handler already consumed
  if (e.defaultPrevented) return;

  const mod = e.metaKey || e.ctrlKey;

  // ⌘N — new blank note
  if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'n') {
    e.preventDefault();
    createNote('blank');
    return;
  }

  // ⌘K — focus search
  if (mod && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  // ⌘S — force save
  if (mod && e.key.toLowerCase() === 's') {
    e.preventDefault();
    flushSave();
    setStatus('saved');
    toast('Saved');
    return;
  }

  // ⌘D — duplicate active note
  if (mod && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    if (activeId) duplicateNote(activeId);
    return;
  }

  // ⌘E — toggle preview
  if (mod && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    togglePreview();
    return;
  }

  // Escape — close dropdowns / blur inputs
  if (e.key === 'Escape') {
    const hadOpen = document.querySelector('.is-open');
    if (hadOpen) {
      document.querySelectorAll('.is-open').forEach((el) => el.classList.remove('is-open'));
      document.querySelectorAll('[aria-expanded="true"]').forEach((el) => el.setAttribute('aria-expanded', 'false'));
    }
    if (isTypingTarget(document.activeElement) && document.activeElement !== searchInput) {
      document.activeElement.blur();
    }
  }
});

/* ============================================================
   27. Live relative timestamps
   ============================================================ */
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  listEl.querySelectorAll('.note-item').forEach((btn) => {
    const note = notes.find((n) => n.id === btn.dataset.id);
    if (!note) return;
    const el = btn.querySelector('.note-item__time');
    if (el) el.textContent = formatTime(note.updatedAt);
  });
}, 60_000);

/* ============================================================
   28. Boot
   ============================================================ */
function init() {
  initTheme();

  notes = loadNotes();
  const sorted = sortedNotes();
  activeId = sorted.length ? sorted[0].id : null;

  applyPreviewMode();
  renderList();
  renderEditor();
}

init();
</script>
