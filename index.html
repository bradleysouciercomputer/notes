  applyFocusMode();
});

/* ============================================================
   17. Note actions
   ============================================================ */
function selectNote(id) {
  if (activeId === id) return;
  activeId = id;
  previewMode = false;
  applyPreviewMode();
  renderList();
  renderEditor();
}

function createNote(templateKey = 'blank') {
  if (sidebarView === 'trash') {
    sidebarView = 'notes';
    try { localStorage.setItem(VIEW_KEY, sidebarView); } catch {}
  }

  const tpl = TEMPLATES[templateKey] || TEMPLATES.blank;
  const now = Date.now();

  const note = {
    id: uid(),
    title: tpl.title,
    body: tpl.body,
    pinned: false,
    color: '',
    deletedAt: 0,
    createdAt: now,
    updatedAt: now
  };

  notes.unshift(note);
  activeId = note.id;

  persist();
  renderList();
  renderEditor();

  requestAnimationFrame(() => {
    if (tpl.title) {
      bodyInput.focus();
      const len = bodyInput.value.length;
      bodyInput.setSelectionRange(len, len);
    } else {
      titleInput.focus();
    }
  });
}

function togglePinNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note || isTrashed(note)) return;
  note.pinned = !note.pinned;
  note.updatedAt = Date.now();
  persist();
  renderList();
  if (activeId === id) renderEditor();
  toast(note.pinned ? 'Note pinned' : 'Note unpinned');
}

function setNoteColor(id, hex) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;
  note.color = hex || '';
  note.updatedAt = Date.now();
  persist();
  renderList();
  if (activeId === id) renderEditor();
  const name = COLORS.find((c) => c.hex === hex)?.name || 'Default';
  toast('Color set to ' + name);
}

function duplicateNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  const now = Date.now();
  const copy = {
    id: uid(),
    title: note.title ? note.title + ' (copy)' : '',
    body: note.body,
    pinned: false,
    color: note.color,
    deletedAt: 0,
    createdAt: now,
    updatedAt: now
  };

  const index = notes.findIndex((n) => n.id === id);
  notes.splice(index + 1, 0, copy);
  activeId = copy.id;

  persist();
  renderList();
  renderEditor();
  toast('Note duplicated');
}

async function copyNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  const text = titleOf(note) + '\n\n' + (note.body || '');
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity  = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('Copied to clipboard');
  } catch {
    toast('Could not copy');
  }
}

async function shareNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;

  const text = titleOf(note) + '\n\n' + (note.body || '');

  if (navigator.share) {
    try {
      await navigator.share({ title: titleOf(note), text });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  copyNote(id);
}

function downloadNote(note) {
  if (!note) return;
  const md = '# ' + titleOf(note) + '\n\n' + (note.body || '');
  const safeName = titleOf(note)
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .toLowerCase() || 'note';

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = safeName + '.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Note downloaded');
}

function printNote() {
  const note = getActiveNote();
  if (!note || isTrashed(note)) return;
  // Ensure preview is rendered for print (the print stylesheet only shows the preview)
  const wasPreview = previewMode;
  if (!wasPreview) {
    previewMode = true;
    applyPreviewMode();
  }
  setTimeout(() => {
    window.print();
    if (!wasPreview) {
      previewMode = false;
      applyPreviewMode();
    }
  }, 60);
}

/* ---------- Trash ---------- */
function trashNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note || isTrashed(note)) return;

  note.deletedAt = Date.now();
  note.pinned = false;
  note.updatedAt = Date.now();

  // Choose a new active note from the same view
  const visible = sortedNotes().filter((n) => !isTrashed(n) && n.id !== id);
  activeId = visible.length ? visible[0].id : null;

  persist();
  renderList();
  renderEditor();

  toast('Note moved to trash', {
    action: {
      label: 'Undo',
      onClick: () => {
        note.deletedAt = 0;
        note.updatedAt = Date.now();
        activeId = note.id;
        sidebarView = 'notes';
        try { localStorage.setItem(VIEW_KEY, sidebarView); } catch {}
        persist();
        renderList();
        renderEditor();
        toast('Note restored');
      }
    },
    duration: 6000
  });
}

function restoreNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;
  note.deletedAt = 0;
  note.updatedAt = Date.now();
  persist();
  renderList();
  renderEditor();
  toast('Note restored');
}

async function purgeNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;
  const ok = await confirmDialog({
    title: 'Delete permanently?',
    message: '“' + titleOf(note) + '” will be gone forever.',
    confirmLabel: 'Delete forever'
  });
  if (!ok) return;

  notes = notes.filter((n) => n.id !== id);
  if (activeId === id) {
    const visible = filteredNotes();
    activeId = visible.length ? visible[0].id : null;
  }
  persist();
  renderList();
  renderEditor();
  toast('Note permanently deleted');
}

async function emptyTrash() {
  const trashed = notes.filter(isTrashed);
  if (!trashed.length) { toast('Trash is already empty'); return; }
  const ok = await confirmDialog({
    title: 'Empty trash?',
    message: trashed.length + (trashed.length === 1 ? ' note will be' : ' notes will be') + ' permanently deleted.',
    confirmLabel: 'Empty trash'
  });
  if (!ok) return;

  notes = notes.filter((n) => !isTrashed(n));
  // Clear the active id if it pointed to a trashed note
  if (!notes.find((n) => n.id === activeId)) activeId = null;

  persist();
  renderList();
  renderEditor();
  toast('Trash emptied');
}

async function deleteNote(id) {
  const note = notes.find((n) => n.id === id);
  if (!note) return;
  if (isTrashed(note)) return purgeNote(id);
  return trashNote(id);
}

/* ============================================================
   18. Editing & autosave
   ============================================================ */
function scheduleSave({ resort = false } = {}) {
  setStatus('saving');

  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ok = persist();
    setStatus(ok ? 'saved' : 'error', ok ? 'Saved' : 'Could not save');
  }, SAVE_DELAY);

  if (resort) {
    clearTimeout(listResortTimer);
    listResortTimer = setTimeout(() => {
      if (sortMode === 'title') return;
      const ae = document.activeElement;
      if (ae === titleInput || ae === bodyInput) return;
      renderList();
    }, 1400);
  }
}

function handleEdit(field, value) {
  const note = getActiveNote();
  if (!note || isTrashed(note)) return;

  note[field] = value;
  note.updatedAt = Date.now();

  if (query.trim()) renderList();
  else updateListRow(note);

  if (field === 'body') {
    updateStats();
    if (previewMode) refreshPreview();
  }

  scheduleSave({ resort: true });
}

titleInput.addEventListener('input', () => handleEdit('title', titleInput.value));
bodyInput.addEventListener('input',  () => handleEdit('body',  bodyInput.value));

function flushSave() {
  clearTimeout(saveTimer);
  persist();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('beforeunload', flushSave);

/* ============================================================
   19. Markdown formatting helpers
   ============================================================ */
function getCurrentLine(ta) {
  const pos = ta.selectionStart;
  const value = ta.value;
  const lineStart = value.lastIndexOf('\n', pos - 1) + 1;
  let lineEnd = value.indexOf('\n', pos);
  if (lineEnd === -1) lineEnd = value.length;
  return { lineStart, lineEnd, text: value.slice(lineStart, lineEnd) };
}

function insertAtCursor(ta, text) {
  const start = ta.selectionStart;
  const end   = ta.selectionEnd;
  const value = ta.value;
  ta.value = value.slice(0, start) + text + value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + text.length;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

function wrapSelection(ta, before, after = before, placeholder = '') {
  const start = ta.selectionStart;
  const end   = ta.selectionEnd;
  const selected = ta.value.slice(start, end);
  const content = selected || placeholder;

  const text = before + content + after;
  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);

  const selStart = start + before.length;
  const selEnd   = selStart + content.length;
  ta.setSelectionRange(selStart, selEnd);

  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

/**
 * Toggle a line prefix.
 * - If the line already starts with `prefix`, remove it.
 * - Otherwise, if it starts with one of `altPrefixes`, replace that with `prefix`.
 * - Otherwise, prepend `prefix`.
 */
function toggleLinePrefix(ta, prefix, altPrefixes = []) {
  const { lineStart, lineEnd, text } = getCurrentLine(ta);
  let newText;

  if (text.startsWith(prefix)) {
    newText = text.slice(prefix.length);
  } else {
    const alt = altPrefixes.find((p) => text.startsWith(p));
    newText = alt ? prefix + text.slice(alt.length) : prefix + text;
  }

  if (newText === text) return;

  const delta = newText.length - text.length;
  ta.value = ta.value.slice(0, lineStart) + newText + ta.value.slice(lineEnd);

  // Clamp caret/selection so they stay within the line
  const clampPos = (p) => Math.max(lineStart, Math.min(lineStart + newText.length, p + delta));
  ta.selectionStart = clampPos(ta.selectionStart);
  ta.selectionEnd   = clampPos(ta.selectionEnd);

  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

function applyFormat(cmd) {
  const ta = bodyInput;
  if (previewMode) return;
  ta.focus();

  switch (cmd) {
    case 'bold':   wrapSelection(ta, '**', '**', 'bold text'); break;
    case 'italic': wrapSelection(ta, '*', '*', 'italic text'); break;
    case 'strike': wrapSelection(ta, '~~', '~~', 'strikethrough'); break;
    case 'code':   wrapSelection(ta, '`', '`', 'code'); break;
    case 'link':   wrapSelection(ta, '[', '](url)', 'link text'); break;

    case 'h1':    toggleLinePrefix(ta, '# ',  ['## ', '### ', '#### ']); break;
    case 'h2':    toggleLinePrefix(ta, '## ', ['# ', '### ', '#### ']); break;
    case 'quote': toggleLinePrefix(ta, '> '); break;
    case 'ul':    toggleLinePrefix(ta, '- ',  ['* ', '+ ', '- [ ] ', '1. ']); break;
    case 'ol':    toggleLinePrefix(ta, '1. ', ['- ', '* ', '+ ', '- [ ] ']); break;
    case 'task':  toggleLinePrefix(ta, '- [ ] ', ['- ', '* ', '+ ']); break;

    case 'hr': {
      const start = ta.selectionStart;
      const end   = ta.selectionEnd;
      const before = ta.value.slice(0, start);
      const after  = ta.value.slice(end);
      const prefix = (before === '' || before.endsWith('\n')) ? '' : '\n';
      const suffix = (after  === '' || after.startsWith('\n')) ? '' : '\n';
      const text = prefix + '---' + suffix;
      ta.value = before + text + after;
      ta.selectionStart = ta.selectionEnd = start + text.length;
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      break;
    }

    case 'codeblock': {
      const start = ta.selectionStart;
      const end   = ta.selectionEnd;
      const sel = ta.value.slice(start, end);
      const before = ta.value.slice(0, start);
      const after  = ta.value.slice(end);
      const padBefore = (before === '' || before.endsWith('\n')) ? '' : '\n';
      const padAfter  = (after === '' || after.startsWith('\n')) ? '' : '\n';
      const body = sel || 'code';
      const block = padBefore + '```\n' + body + '\n```' + padAfter;
      ta.value = before + block + after;
      const bodyStart = start + padBefore.length + 4; // 4 = len("```\n")
      ta.selectionStart = bodyStart;
      ta.selectionEnd   = bodyStart + body.length;
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      break;
    }
  }
}

toolbar.addEventListener('click', (e) => {
  const btn = e.target.closest('.toolbar__btn');
  if (!btn) return;
  applyFormat(btn.dataset.cmd);
});

/* ============================================================
   20. Auto-list continuation + Tab indent
   ============================================================ */
bodyInput.addEventListener('keydown', (e) => {
  // Enter — continue lists
  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
    const { lineStart, lineEnd, text } = getCurrentLine(bodyInput);

    // Only when the caret is at the end of the current line
    if (bodyInput.selectionStart !== lineEnd) return;

    // Task list
    const taskMatch = text.match(/^(\s*)([-*])\s+\[([ xX])\]\s+(.*)$/);
    if (taskMatch) {
      e.preventDefault();
      const [, indent, bullet, , content] = taskMatch;
      if (!content.trim()) {
        bodyInput.value = bodyInput.value.slice(0, lineStart) + indent + bodyInput.value.slice(lineEnd);
        bodyInput.selectionStart = bodyInput.selectionEnd = lineStart + indent.length;
        bodyInput.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        insertAtCursor(bodyInput, '\n' + indent + bullet + ' [ ] ');
      }
      return;
    }

    // Bullet list
    const ulMatch = text.match(/^(\s*)([-*+])\s+(.*)$/);
    if (ulMatch) {
      e.preventDefault();
      const [, indent, bullet, content] = ulMatch;
      if (!content.trim()) {
        bodyInput.value = bodyInput.value.slice(0, lineStart) + indent + bodyInput.value.slice(lineEnd);
        bodyInput.selectionStart = bodyInput.selectionEnd = lineStart + indent.length;
        bodyInput.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        insertAtCursor(bodyInput, '\n' + indent + bullet + ' ');
      }
      return;
    }

    // Numbered list
    const olMatch = text.match(/^(\s*)(\d+)\.\s+(.*)$/);
    if (olMatch) {
      e.preventDefault();
      const [, indent, num, content] = olMatch;
      if (!content.trim()) {
        bodyInput.value = bodyInput.value.slice(0, lineStart) + indent + bodyInput.value.slice(lineEnd);
        bodyInput.selectionStart = bodyInput.selectionEnd = lineStart + indent.length;
        bodyInput.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        insertAtCursor(bodyInput, '\n' + indent + (parseInt(num, 10) + 1) + '. ');
      }
      return;
    }

    // Blockquote
    const bqMatch = text.match(/^(\s*)>\s?(.*)$/);
    if (bqMatch) {
      e.preventDefault();
      const [, indent, content] = bqMatch;
      if (!content.trim()) {
        bodyInput.value = bodyInput.value.slice(0, lineStart) + indent + bodyInput.value.slice(lineEnd);
        bodyInput.selectionStart = bodyInput.selectionEnd = lineStart + indent.length;
        bodyInput.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        insertAtCursor(bodyInput, '\n' + indent + '> ');
      }
      return;
    }
    return;
  }

  // Tab / Shift+Tab — indent the current line
  if (e.key === 'Tab') {
    e.preventDefault();
    const { lineStart, lineEnd, text } = getCurrentLine(bodyInput);
    const value = bodyInput.value;

    if (e.shiftKey) {
      const toRemove = text.match(/^(\s{1,2})/);
      if (toRemove) {
        const n = toRemove[1].length;
        bodyInput.value = value.slice(0, lineStart) + text.slice(n) + value.slice(lineEnd);
        bodyInput.selectionStart = Math.max(lineStart, bodyInput.selectionStart - n);
        bodyInput.selectionEnd   = Math.max(lineStart, bodyInput.selectionEnd - n);
        bodyInput.dispatchEvent(new Event('input', { bubbles: true }));
      }
    } else {
      bodyInput.value = value.slice(0, lineStart) + '  ' + value.slice(lineStart);
      bodyInput.selectionStart += 2;
      bodyInput.selectionEnd   += 2;
      bodyInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
});

function exportAllNotes() {
  const active = notes.filter((n) => !isTrashed(n));
  if (!active.length) { toast('No notes to export'); return; }

  const payload = { version: 4, exportedAt: new Date().toISOString(), notes: active };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'notes-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Exported ' + active.length + (active.length === 1 ? ' note' : ' notes'));
}

importInput.addEventListener('change', async () => {
  const file = importInput.files && importInput.files[0];
  importInput.value = '';
  if (!file) return;

  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    const incoming = Array.isArray(parsed)
      ? parsed
      : (parsed && Array.isArray(parsed.notes) ? parsed.notes : null);
    if (!incoming) throw new Error('Invalid format');

    const existingIds = new Set(notes.map((n) => n.id));
    let added = 0;

    incoming.forEach((raw) => {
      if (!raw || typeof raw !== 'object') return;
      const now = Date.now();
      let id = typeof raw.id === 'string' && raw.id ? raw.id : uid();
      if (existingIds.has(id)) id = uid();
      existingIds.add(id);

      notes.push({
        id,
        title:     typeof raw.title === 'string' ? raw.title : '',
        body:      typeof raw.body  === 'string' ? raw.body  : '',
        pinned:    !!raw.pinned,
        color:     typeof raw.color === 'string' ? raw.color : '',
        deletedAt: 0,
        createdAt: Number(raw.createdAt) || now,
        updatedAt: Number(raw.updatedAt) || now
      });
      added++;
    });

    if (!added) { toast('No valid notes found'); return; }
    if (!activeId) {
      const sorted = sortedNotes().filter((n) => !isTrashed(n));
      activeId = sorted.length ? sorted[0].id : null;
    }

    persist();
    renderList();
    renderEditor();
    toast('Imported ' + added + (added === 1 ? ' note' : ' notes'));
  } catch {
    toast('Could not read that file');
  }
});

async function clearAllNotes() {
  const active = notes.filter((n) => !isTrashed(n));
  if (!active.length) { toast('No notes to delete'); return; }

  const ok = await confirmDialog({
    title: 'Move all notes to trash?',
    message: 'All ' + active.length + ' notes will be moved to trash. You can restore them for 30 days.',
    confirmLabel: 'Move to trash'
  });
  if (!ok) return;

  const now = Date.now();
  active.forEach((n) => { n.deletedAt = now; n.pinned = false; });
  activeId = null;

  persist();
  renderList();
  renderEditor();
  toast('All notes moved to trash');
}

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  searchClear.classList.add('hidden');
  renderList();
  searchInput.focus();
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    if (query) {
      searchInput.value = '';
      query = '';
      searchClear.classList.add('hidden');
      renderList();
    } else searchInput.blur();
  } else if (e.key === 'Enter') {
    const first = listEl.querySelector('.note-item');
    if (first) { first.click(); first.focus(); }
  }
});

/* ============================================================
   26. Sort
   ============================================================ */
try {
  const stored = localStorage.getItem(SORT_KEY);
  if (stored && ['updated', 'created', 'title', 'color'].includes(stored)) sortMode = stored;
} catch {}
sortSelect.value = sortMode;

sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  try { localStorage.setItem(SORT_KEY, sortMode); } catch {}
  renderList();
});

/* ============================================================
   27. List keyboard navigation
   ============================================================ */
listEl.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const items = [...listEl.querySelectorAll('.note-item')];
  const i = items.indexOf(document.activeElement);
  if (i === -1) return;
  e.preventDefault();
  const next = e.key === 'ArrowDown' ? items[i + 1] : items[i - 1];
  if (next) { next.focus(); next.click(); }
});

/* ============================================================
   28. Quick switcher
   ============================================================ */
const quickBackdrop = $('quickBackdrop');
const quickInput    = $('quickInput');
const quickList     = $('quickList');

let quickResults = [];
let quickIndex   = 0;
let quickLastFocused = null;

function fuzzyScore(query, text) {
  if (!query) return 1;
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  if (t.includes(q)) return 2 + (q.length / Math.max(1, t.length));
  let qi = 0;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) qi++;
  }
  return qi === q.length ? 1 : 0;
}

function openQuickSwitcher() {
  quickLastFocused = document.activeElement;
  quickInput.value = '';
  quickBackdrop.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderQuickResults('');
  requestAnimationFrame(() => quickInput.focus());
}

function closeQuickSwitcher() {
  quickBackdrop.classList.add('hidden');
  document.body.style.overflow = '';
  if (quickLastFocused && quickLastFocused.isConnected) quickLastFocused.focus({ preventScroll: true });
  quickLastFocused = null;
}

function renderQuickResults(q) {
  const candidates = notes.filter((n) => !isTrashed(n));
  const scored = candidates
    .map((n) => {
      const titleScore = fuzzyScore(q, titleOf(n));
      const bodyScore  = fuzzyScore(q, (n.body || '').slice(0, 200));
      return { note: n, score: Math.max(titleScore * 2, bodyScore) };
    })
    .filter((x) => x.score > 0 || !q)
    .sort((a, b) => b.score - a.score || b.note.updatedAt - a.note.updatedAt)
    .slice(0, 30);

  quickResults = scored.map((x) => x.note);
  quickIndex = 0;
  quickList.innerHTML = '';

  if (!quickResults.length) {
    const li = document.createElement('li');
    li.className = 'list-empty';
    li.textContent = q ? 'No matching notes.' : 'No notes yet.';
    quickList.appendChild(li);
    return;
  }

  quickResults.forEach((note, i) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.setAttribute('aria-selected', i === quickIndex ? 'true' : 'false');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'quick-switcher__item' + (i === quickIndex ? ' is-focused' : '');
    btn.dataset.id = note.id;

    btn.innerHTML =
      '<span class="quick-switcher__text">' +
        '<span class="quick-switcher__title">' + escapeHtml(titleOf(note)) + '</span>' +
        '<span class="quick-switcher__meta">' + escapeHtml(previewOf(note)) + ' · ' + escapeHtml(formatTime(note.updatedAt)) + '</span>' +
      '</span>';

    btn.addEventListener('click', () => {
      const id = note.id;
      closeQuickSwitcher();
      setTimeout(() => openFromQuickSwitcher(id), 0);
    });

    li.appendChild(btn);
    quickList.appendChild(li);
  });
}

function openFromQuickSwitcher(id) {
  if (sidebarView === 'trash') {
    sidebarView = 'notes';
    try { localStorage.setItem(VIEW_KEY, sidebarView); } catch {}
  }
  query = '';
  searchInput.value = '';
  searchClear.classList.add('hidden');

  activeId = id;
  previewMode = false;
  applyPreviewMode();
  renderList();
  renderEditor();
}

function moveQuickIndex(delta) {
  if (!quickResults.length) return;
  quickIndex = (quickIndex + delta + quickResults.length) % quickResults.length;
  const items = [...quickList.querySelectorAll('.quick-switcher__item')];
  items.forEach((el, i) => {
    el.classList.toggle('is-focused', i === quickIndex);
    el.parentElement.setAttribute('aria-selected', i === quickIndex ? 'true' : 'false');
  });
  items[quickIndex]?.scrollIntoView({ block: 'nearest' });
}

quickInput.addEventListener('input', () => {
  renderQuickResults(quickInput.value);
});

quickInput.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveQuickIndex(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveQuickIndex(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const note = quickResults[quickIndex];
    if (note) {
      closeQuickSwitcher();
      setTimeout(() => openFromQuickSwitcher(note.id), 0);
    }
  } else if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    closeQuickSwitcher();
  }
});

quickBackdrop.addEventListener('mousedown', (e) => {
  if (e.target === quickBackdrop) closeQuickSwitcher();
});

/* ============================================================
   29. Context menus
   ============================================================ */
function showNoteContextMenu(x, y, noteId) {
  const note = notes.find((n) => n.id === noteId);
  if (!note) return;

  if (isTrashed(note)) {
    showContextMenu(x, y, [
      { label: 'Restore',           icon: ICON.restore,  action: () => restoreNote(noteId) },
      { label: 'Copy to clipboard', icon: ICON.copy,     action: () => copyNote(noteId) },
      { label: 'Download as .md',   icon: ICON.download, action: () => downloadNote(note) },
      { type: 'separator' },
      { label: 'Delete permanently', icon: ICON.del, danger: true, action: () => purgeNote(noteId) }
    ]);
    return;
  }

  showContextMenu(x, y, [
    { label: 'Open',  icon: ICON.open, action: () => selectNote(noteId) },
    {
      label: note.pinned ? 'Unpin' : 'Pin',
      icon: ICON.pin,
      action: () => togglePinNote(noteId)
    },
    { type: 'colors', current: note.color, onPick: (hex) => setNoteColor(noteId, hex) },
    { type: 'separator' },
    { label: 'Duplicate',         icon: ICON.duplicate, shortcut: IS_MAC ? '⌘D' : 'Ctrl+D', action: () => duplicateNote(noteId) },
    { label: 'Copy to clipboard', icon: ICON.copy,      action: () => copyNote(noteId) },
    { label: 'Download as .md',   icon: ICON.download,  action: () => downloadNote(note) },
    { type: 'separator' },
    { label: 'Move to trash', icon: ICON.del, danger: true, action: () => trashNote(noteId) }
  ]);
}

function showListEmptyContextMenu(x, y) {
  if (sidebarView === 'trash') {
    showContextMenu(x, y, [
      { label: 'Empty trash', icon: ICON.del, danger: true, action: emptyTrash }
    ]);
    return;
  }
  showContextMenu(x, y, [
    { label: 'New note',      icon: ICON.newNote, shortcut: IS_MAC ? '⌘N' : 'Ctrl+N', action: () => createNote('blank') },
    { label: 'Meeting notes', icon: ICON.meeting, action: () => createNote('meeting') },
    { label: 'To-do list',    icon: ICON.todo,    action: () => createNote('todo') },
    { label: 'Idea',          icon: ICON.idea,    action: () => createNote('idea') },
    { type: 'separator' },
    { label: 'Quick switcher',   icon: ICON.doc,       shortcut: IS_MAC ? '⌘P' : 'Ctrl+P', action: openQuickSwitcher },
    { label: 'Export all notes', icon: ICON.download,  action: exportAllNotes },
    { label: 'Import notes…',    icon: ICON.upload,    action: () => importInput.click() }
  ]);
}

function showEditorContextMenu(x, y) {
  const note = getActiveNote();
  if (!note || isTrashed(note)) return;

  showContextMenu(x, y, [
    {
      label: previewMode ? 'Edit note' : 'Preview markdown',
      icon: previewMode ? ICON.edit : ICON.eye,
      shortcut: IS_MAC ? '⌘E' : 'Ctrl+E',
      action: togglePreview
    },
    { type: 'separator' },
    { label: 'Duplicate',         icon: ICON.duplicate, shortcut: IS_MAC ? '⌘D' : 'Ctrl+D', action: () => duplicateNote(note.id) },
    { label: 'Copy to clipboard', icon: ICON.copy,      action: () => copyNote(note.id) },
    { label: 'Share…',            icon: ICON.share,     action: () => shareNote(note.id) },
    { label: 'Download as .md',   icon: ICON.download,  action: () => downloadNote(note) },
    { label: 'Print note',        icon: ICON.print,     action: printNote },
    { type: 'separator' },
    { label: 'Move to trash', icon: ICON.del, danger: true, action: () => trashNote(note.id) }
  ]);
}

/* ---- Right-click handlers ---- */
listEl.addEventListener('contextmenu', (e) => {
  const item = e.target.closest('.note-item');
  e.preventDefault();
  if (contextMenu.classList.contains('is-open')) return;
  if (item) showNoteContextMenu(e.clientX, e.clientY, item.dataset.id);
  else showListEmptyContextMenu(e.clientX, e.clientY);
});

editorPane.addEventListener('contextmenu', (e) => {
  if (e.target.closest('input, textarea')) return;
  e.preventDefault();
  if (contextMenu.classList.contains('is-open')) return;
  showEditorContextMenu(e.clientX, e.clientY);
});

document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('.menu, .modal-backdrop, .toast-stack, input, textarea, .quick-backdrop, .context-menu')) return;
  if (e.target.closest('.sidebar, .editor, .toolbar')) e.preventDefault();
});

/* ---- Long-press (touch) ---- */
let lpTimer = null;
let lpStart = null;
let lpFiredAt = 0;

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  const item = e.target.closest('.note-item');
  if (!item) return;

  lpStart = { x: e.clientX, y: e.clientY, id: item.dataset.id };
  clearTimeout(lpTimer);

  lpTimer = setTimeout(() => {
    lpFiredAt = Date.now();
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
    showNoteContextMenu(lpStart.x, lpStart.y, lpStart.id);
  }, 480);
}, { passive: true });

document.addEventListener('pointermove', (e) => {
  if (!lpTimer || !lpStart) return;
  const dx = e.clientX - lpStart.x;
  const dy = e.clientY - lpStart.y;
  if (Math.hypot(dx, dy) > 12) {
    clearTimeout(lpTimer);
    lpTimer = null;
    lpStart = null;
  }
}, { passive: true });

document.addEventListener('pointerup', () => {
  clearTimeout(lpTimer);
  lpTimer = null;
  lpStart = null;
}, { passive: true });

document.addEventListener('pointercancel', () => {
  clearTimeout(lpTimer);
  lpTimer = null;
  lpStart = null;
}, { passive: true });

document.addEventListener('click', (e) => {
  if (lpFiredAt && Date.now() - lpFiredAt < 600) {
    e.preventDefault();
    e.stopPropagation();
    lpFiredAt = 0;
  }
}, true);

/* ============================================================
   30. Global keyboard shortcuts
   ============================================================ */
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

document.addEventListener('keydown', (e) => {
  if (!modalBackdrop.classList.contains('hidden')) return;
  if (!quickBackdrop.classList.contains('hidden')) return;
  if (contextMenu.classList.contains('is-open')) return;
  if (e.defaultPrevented) return;

  const mod = e.metaKey || e.ctrlKey;
  const key = e.key.toLowerCase();

  // ⌘P — quick switcher
  if (mod && key === 'p' && !e.shiftKey) {
    e.preventDefault();
    openQuickSwitcher();
    return;
  }

  // ⌘N — new blank note
  if (mod && !e.shiftKey && !e.altKey && key === 'n') {
    e.preventDefault();
    createNote('blank');
    return;
  }

  // ⌘K — link formatting (when editing body)
  if (mod && key === 'k') {
    if (document.activeElement === bodyInput && !previewMode) {
      e.preventDefault();
      applyFormat('link');
      return;
    }
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  // ⌘S — force save
  if (mod && key === 's') {
    e.preventDefault();
    flushSave();
    setStatus('saved');
    toast('Saved');
    return;
  }

  // ⌘D — duplicate
  if (mod && key === 'd') {
    e.preventDefault();
    if (activeId) duplicateNote(activeId);
    return;
  }

  // ⌘E — toggle preview
  if (mod && key === 'e') {
    e.preventDefault();
    togglePreview();
    return;
  }

  // ⌘. — focus mode
  if (mod && key === '.') {
    e.preventDefault();
    focusMode = !focusMode;
    applyFocusMode();
    return;
  }

  // ⌘B / ⌘I / ⌘⇧X / ⌘⇧C — inline formatting
  if (mod && document.activeElement === bodyInput && !previewMode) {
    if (key === 'b' && !e.shiftKey) { e.preventDefault(); applyFormat('bold');   return; }
    if (key === 'i' && !e.shiftKey) { e.preventDefault(); applyFormat('italic'); return; }
    if (e.shiftKey && key === 'x')  { e.preventDefault(); applyFormat('strike'); return; }
    if (e.shiftKey && key === 'c')  { e.preventDefault(); applyFormat('code');   return; }
  }

  // Escape — close menus / blur inputs
  if (e.key === 'Escape') {
    const hadOpen = document.querySelector('.is-open');
    if (hadOpen) {
      document.querySelectorAll('.is-open').forEach((el) => {
        if (!el.classList.contains('context-menu')) el.classList.remove('is-open');
      });
      document.querySelectorAll('[aria-expanded="true"]').forEach((el) => el.setAttribute('aria-expanded', 'false'));
    }
    if (isTypingTarget(document.activeElement) && document.activeElement !== searchInput) {
      document.activeElement.blur();
    }
  }
});

/* ============================================================
   31. Live relative timestamps
   ============================================================ */
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  listEl.querySelectorAll('.note-item').forEach((btn) => {
    const note = notes.find((n) => n.id === btn.dataset.id);
    if (!note) return;
    const el = btn.querySelector('.note-item__time');
    if (el) {
      el.textContent = formatTime(note.updatedAt)
        + (isTrashed(note) ? ' · deleted ' + formatTime(note.deletedAt) : '');
    }
  });
}, 60_000);

/* ============================================================
   32. Boot
   ============================================================ */
function init() {
  initTheme();

  try {
    const v = localStorage.getItem(VIEW_KEY);
    if (v === 'trash' || v === 'notes') sidebarView = v;
    if (localStorage.getItem(FOCUS_KEY) === '1') focusMode = true;
  } catch {}

  notes = loadNotes();

  if (purgeOldTrash()) persist();

  const visible = sortedNotes().filter((n) =>
    sidebarView === 'trash' ? isTrashed(n) : !isTrashed(n)
  );
  activeId = visible.length ? visible[0].id : null;

  applyPreviewMode();
  applyFocusMode();
  renderList();
  renderEditor();
}

init();
</script>
